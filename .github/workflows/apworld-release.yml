# NOTE:
# This workflow is intentionally self-contained.
# It assumes:
#   - Your APWorld lives in worlds/<world>/
#   - It has an archipelago.json
#   - Launcher.py "Build APWorlds" outputs to build/apworlds/
#
# Requires:
#   permissions:
#     contents: write
#
# Tested target:
#   Archipelago source checkout

name: APWorld Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        required: true
        default: main

      world:
        description: World folder (example: apquest)
        required: true
        default: apquest

      bump:
        description: Version bump
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - none

      world_version:
        description: Override world_version (blank = bump)
        required: false
        default: ""

      game:
        description: Override game
        required: false
        default: ""

      minimum_ap_version:
        description: Override minimum_ap_version
        required: false
        default: ""

      maximum_ap_version:
        description: Override maximum_ap_version
        required: false
        default: ""

      authors:
        description: Override authors (comma separated)
        required: false
        default: ""

      clamp_minimum_ap_version:
        description: Clamp minimum_ap_version to latest stable AP release
        type: boolean
        default: true

      include_changelog:
        description: Include changelog in release notes
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      PYTHON_VERSION: "3.12"

    steps:

      ####################################################################
      # Checkout
      ####################################################################

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      ####################################################################
      # Latest Stable Archipelago Release
      ####################################################################

      - name: Get latest stable Archipelago version
        id: ap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          VERSION=$(curl -fsSL \
            https://api.github.com/repos/ArchipelagoMW/Archipelago/releases \
            | jq -r '[.[] | select(.prerelease == false)][0].tag_name' \
            | sed 's/^v//')

          echo "Latest stable AP version: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      ####################################################################
      # Update archipelago.json
      ####################################################################

      - name: Update manifest
        id: manifest
        env:
          WORLD: ${{ github.event.inputs.world }}
          BUMP: ${{ github.event.inputs.bump }}
          OVERRIDE_VERSION: ${{ github.event.inputs.world_version }}
          GAME: ${{ github.event.inputs.game }}
          MINIMUM: ${{ github.event.inputs.minimum_ap_version }}
          MAXIMUM: ${{ github.event.inputs.maximum_ap_version }}
          AUTHORS: ${{ github.event.inputs.authors }}
          CLAMP: ${{ github.event.inputs.clamp_minimum_ap_version }}
          STABLE_AP: ${{ steps.ap.outputs.version }}
        run: |

          python <<'PY'
          import json
          import os
          from pathlib import Path

          def version_tuple(v):
              return tuple(map(int, v.split(".")))

          path = Path(f"worlds/{os.environ['WORLD']}/archipelago.json")

          data = json.loads(path.read_text())

          override = os.environ["OVERRIDE_VERSION"]

          if override:
              version = override
          else:
              version = data["world_version"]

              if os.environ["BUMP"] != "none":
                  major, minor, patch = map(int, version.split("."))

                  if os.environ["BUMP"] == "major":
                      major += 1
                      minor = 0
                      patch = 0

                  elif os.environ["BUMP"] == "minor":
                      minor += 1
                      patch = 0

                  elif os.environ["BUMP"] == "patch":
                      patch += 1

                  version = f"{major}.{minor}.{patch}"

          data["world_version"] = version

          if os.environ["GAME"]:
              data["game"] = os.environ["GAME"]

          if os.environ["MINIMUM"]:
              data["minimum_ap_version"] = os.environ["MINIMUM"]

          if os.environ["MAXIMUM"]:
              data["maximum_ap_version"] = os.environ["MAXIMUM"]

          if os.environ["AUTHORS"]:
              data["authors"] = [
                  x.strip()
                  for x in os.environ["AUTHORS"].split(",")
                  if x.strip()
              ]

          if (
              os.environ["CLAMP"] == "true"
              and "minimum_ap_version" in data
          ):
              stable = os.environ["STABLE_AP"]

              if version_tuple(data["minimum_ap_version"]) > version_tuple(stable):
                  print(
                      f"Clamping minimum_ap_version "
                      f"{data['minimum_ap_version']} -> {stable}"
                  )
                  data["minimum_ap_version"] = stable

          path.write_text(
              json.dumps(data, indent=4) + "\n"
          )

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print(f"world_version={version}", file=f)
              print(f"game={data['game']}", file=f)

          PY

      ####################################################################
      # Commit manifest
      ####################################################################

      - name: Commit version bump
        run: |

          git config user.name github-actions
          git config user.email github-actions@github.com

          git add worlds/${{ github.event.inputs.world }}/archipelago.json

          git commit \
            -m "Release ${{ github.event.inputs.world }} v${{ steps.manifest.outputs.world_version }}" \
            || true

          git push origin HEAD:${{ github.event.inputs.branch }}

      ####################################################################
      # Build
      ####################################################################

      - name: Build APWorld
        run: |

          python Launcher.py \
            "Build APWorlds" \
            -- \
            "${{ github.event.inputs.world }}"

      - name: Verify output
        run: |

          test -f build/apworlds/${{ github.event.inputs.world }}.apworld

      ####################################################################
      # Previous Release
      ####################################################################

      - name: Find previous release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          TAG=$(gh release list \
            --limit 200 \
            --json tagName \
            --jq '.[] | .tagName' \
            | grep "^${{ github.event.inputs.world }}-v" \
            | head -n1 || true)

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      ####################################################################
      # Release Notes
      ####################################################################

      - name: Generate release notes
        env:
          WORLD: ${{ github.event.inputs.world }}
          VERSION: ${{ steps.manifest.outputs.world_version }}
          BRANCH: ${{ github.event.inputs.branch }}
          PREVIOUS: ${{ steps.previous.outputs.tag }}
          INCLUDE_CHANGELOG: ${{ github.event.inputs.include_changelog }}
        run: |

          cat > release_notes.md <<EOF
          ## Installation & Setup

          - Requires [Archipelago Launcher](https://github.com/ArchipelagoMW/Archipelago/releases/latest). (Make sure you're up-to-date).
          - Download the \`.apworld\` file below and double-click it to install. After the installation confirmation appears, restart Archipelago.
          - Use **Options Creator** or **Generate Template Options** in the Archipelago Launcher to generate player option YAML files.
          - Place your edited player option YAMLs in the \`Players\` folder. (Use **Browse Files...** in the Launcher to open your Archipelago directory.)
          - Make sure you have all required \`.apworld\` files, your player YAMLs, and any desired \`host.yaml\` settings ready before generating. (\`server_password\` is recommended for admin login.)
          - Click **Generate** to create a multiworld \`.zip\` in the \`output\` folder. (The terminal closes automatically if generation succeeds.)
          - Upload the generated \`.zip\` to https://archipelago.gg/uploads or self-host. (Self hosting to other players requires port forwarding)
          - Documentation:
            https://github.com/${{ github.repository }}/tree/${BRANCH}/worlds/${WORLD}/docs
          - If you encounter errors, run ArchipelagoLauncherDebug.exe (or start from a terminal) and inspect the logs folder.
          - Need help? https://discord.gg/8Z65BR2

          EOF

          if [ "$INCLUDE_CHANGELOG" = "true" ]; then

            echo "" >> release_notes.md
            echo "## Changelog" >> release_notes.md
            echo "" >> release_notes.md

            if [ -n "$PREVIOUS" ]; then

              git log \
                "$PREVIOUS"..HEAD \
                --no-merges \
                --pretty="- %s (%h)" \
                -- \
                worlds/${WORLD}/ \
                >> release_notes.md

            else

              git log \
                --no-merges \
                --pretty="- %s (%h)" \
                -- \
                worlds/${WORLD}/ \
                >> release_notes.md

            fi

          fi

      ####################################################################
      # Tag
      ####################################################################

      - name: Create tag
        run: |

          TAG="${{ github.event.inputs.world }}-v${{ steps.manifest.outputs.world_version }}"

          git tag "$TAG"

          git push origin "$TAG"

      ####################################################################
      # Release
      ####################################################################

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.world }}-v${{ steps.manifest.outputs.world_version }}
          name: ${{ github.event.inputs.world }} apworld release v${{ steps.manifest.outputs.world_version }}
          body_path: release_notes.md
          files: build/apworlds/${{ github.event.inputs.world }}.apworld