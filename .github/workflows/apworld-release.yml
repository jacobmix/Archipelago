name: APWorld Release

# Be free to use, copy, edit or share this workflow.
# You can change defaults or add sections.
# Each branch can have their own completely different workflow.
# Companion mod setup:
# 1. Set include_mod when dispatching this workflow.
# 2. Edit .github/apworld-release-mod.json for the mod project on its own
#    branch: repository (blank means this repo), source_ref, project_path,
#    Java version, optional SemVer version override, asset_name, artifact_path,
#    optional protocol_file, version_catalog, legacy previous_* values,
#    changelog_file, and release_title.
#    A blank version reads mod_version from gradle.properties. A blank asset
#    name keeps the generated filename; a blank artifact_path requires exactly
#    one non-source JAR under build/libs. A blank protocol_file skips the
#    static APMC compatibility check.
# 3. Use release_scope=both for the first paired release. Later one-sided
#    releases reuse assets from the latest stable release only; prereleases
#    are never used as a fallback.
# 4. When the mod config names a protocol source file, the workflow checks
#    that its supported APMC versions include the APWorld client_version.
#    APWorld and mod SemVer major/minor values must match; patch/build metadata
#    may differ (for example APWorld 2.2.1 with mod 2.2.2+26.3).
# 5. The successful release includes release-metadata.json. That lets future
#    releases preserve both exact asset names and versions. The mod catalog is
#    updated after publishing when its source branch is in this repository.
#    The catalog entry uses channel=beta for prereleases and channel=release
#    for stable releases, and points to the new release asset.
#
# To customize another companion project, copy the JSON config and point its
# settings at that project's Gradle wrapper, artifact, protocol check, and
# version catalog. Set catalog to an empty string to skip catalog updates.
# 
# Recommend using a workflow like this to keep proper releases easy to make.
# Good for indexers like:
# <https://github.com/silasary/apworlds>
# <https://github.com/ionium-ap/Archipelago-index>
# 
# To do:
# Add more comments
# Explain archipelago/workflow setup
# Mention some standards & tips + link docs
# Like .apignore‎ exclusions.
# Get more out of propper versions like:
# <https://github.com/jacobmix/Archipelago/blob/rac2/worlds/rac2/__init__.py#L23-L34>
# <https://github.com/jacobmix/Archipelago/blob/rac2/worlds/rac2/Rac2Client.py#L396-L418>
# Include steps for how to setup self-hosted runner: https://docs.github.com/en/actions/how-tos/manage-runners/self-hosted-runners/add-runners (Or at least warn/stop 1000 fuzzers from working without it/paying for more GitHub Actions)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: |
          World version bump (ignored if world version is provided):
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - none

      world_version:
        description: |
          Override world version (leave blank to use the selected bump):
        required: false
        default: ""

      game:
        description: |
          Override game name (required if archipelago.json lacks one):
        required: false
        default: ""

      build_environment:
        description: |
          AP environment: latest (newest stable), main (upstream), local (branch):
        type: choice
        default: "latest"
        options:
          - "latest"
          - "main"
          - "local"

      apworld_path:
        description: |
          Apworld path, opt. followed by ':Name' (e.g., .:apquest or worlds/apquest) If no name is provided, the branch name is used. (blank = .:<branch> or worlds/<branch>:<branch>):
        required: false
        default: "worlds/minecraft:minecraft"

      flags:
        description: |
          Add manifest flags as a comma-separated list. Like: "supports_deathlink, tracker_included". ("unready" added or removed based on if normal releases exist):
        required: false
        default: ""

      authors:
        description: |
          Override authors as a comma-separated list:
        required: false
        default: ""

      minimum_ap_version:
        description: |
          Override minimum Archipelago version (blank = keep current):
        required: false
        default: ""

      maximum_ap_version:
        description: |
          Override maximum Archipelago version (blank = keep current):
        required: false
        default: ""

      clamp_minimum_ap_version:
        description: |
          Clamp minimum_ap_version to the latest stable release.
        type: boolean
        default: true

      prerelease:
        description: |
          Mark the GitHub release as a pre-release.
        type: boolean
        default: true

      include_mod:
        description: |
          Build or reuse the companion mod configured in .github/apworld-release-mod.json and include it beside the APWorld.
        type: boolean
        default: true

      release_scope:
        description: |
          When a mod is included: build both, update only the APWorld, or update only the mod. One-sided releases reuse the matching asset from the latest stable release.
        type: choice
        default: both
        options:
          - both
          - apworld_only
          - mod_only

      include_player_yaml:
        description: |
          Include generated player options YAML in the release.
        type: boolean
        default: true

      include_changelog:
        description: |
          Include changes under the APWorld source directory in release notes.
        type: boolean
        default: true

      release_notes_file:
        description: |
          Release notes template path (blank = built-in template).
        required: false
        default: ""

      run_generation:
        description: |
          Run a multiworld generation test using APWorld and APQuest.
        type: boolean
        default: false

      fuzzer_preset:
        description: Fuzzer preset (presets are defined in the workflow)
        type: choice
        default: "None"
        options:
          - "None"
          - "Smoke"
          - "All at 100"
          - "All at 500"
          - "All at 1000"
          - "Normal only at 100"

      fuzzer_jobs:
        description: |
          Number of parallel fuzzer workers.
        type: number
        default: 4

      fuzzer_timeout:
        description: |
          Maximum seconds allowed per fuzzer generation.
        type: number
        default: 25

      use_fuzzer_meta:
        description: |
          Use the meta.yaml file from the repository root for fuzzer runs.
        type: boolean
        default: false

      run_tests:
        description: |
          Run the Archipelago unit tests before releasing.
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: apworld-release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PYTHON_VERSION: "3.12"

    steps:

      ######################################################################
      # Checkout source repository
      ######################################################################

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      ######################################################################
      # Validate source branch
      ######################################################################

      - name: Verify world branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "Branch: $BRANCH"

          if [ "$BRANCH" = "main" ]; then
            echo "::error::Releases must not be run from main."
            exit 1
          fi

      - name: Validate branch name
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if ! git check-ref-format --branch "$BRANCH" >/dev/null; then
            echo "::error::Invalid world branch name: $BRANCH"
            echo "::error::World branch name must be a valid Git branch name."
            exit 1
          fi

      - name: Resolve companion mod settings
        id: mod_settings
        if: inputs.include_mod
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(".github/apworld-release-mod.json")
          if not path.is_file():
              raise SystemExit(
                  "include_mod is enabled, but .github/apworld-release-mod.json is missing. "
                  "Copy the example config and set its source_ref."
              )

          config = json.loads(path.read_text(encoding="utf-8"))
          defaults = {
              "source_repository": os.environ["REPOSITORY"],
              "source_ref": "",
              "project_path": ".",
              "java_version": "25",
              "version": "",
              "asset_name": "",
              "artifact_path": "",
              "protocol_file": "",
              "version_catalog": "",
              "previous_asset": "",
              "previous_version": "",
              "previous_client_version": "",
              "changelog_file": "",
              "release_title": "",
          }
          defaults.update(config)
          defaults["source_repository"] = defaults["source_repository"] or os.environ["REPOSITORY"]

          if defaults["java_version"] not in {"21", "25"}:
              raise SystemExit("mod config java_version must be 21 or 25.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
              for key, value in defaults.items():
                  value = str(value).strip()
                  if "\n" in value or "\r" in value:
                      raise SystemExit(f"Mod config value {key} must be a single line.")
                  output_file.write(f"{key}={value}\n")
          PY

      - name: Validate companion mod settings
        if: inputs.include_mod
        env:
          RELEASE_SCOPE: ${{ inputs.release_scope }}
          MOD_SOURCE_REF: ${{ steps.mod_settings.outputs.source_ref }}
        run: |
          if [ "$RELEASE_SCOPE" != "both" ] && [ "$RELEASE_SCOPE" != "apworld_only" ] && [ "$RELEASE_SCOPE" != "mod_only" ]; then
            echo "::error::Unknown release scope: $RELEASE_SCOPE"
            exit 1
          fi

          if [ "$RELEASE_SCOPE" != "apworld_only" ] && [ -z "$MOD_SOURCE_REF" ]; then
            echo "::error::Set mod_source_ref when building the companion mod."
            exit 1
          fi

          if [ "$RELEASE_SCOPE" != "apworld_only" ]; then
            if ! git check-ref-format --branch "$MOD_SOURCE_REF" >/dev/null && ! git check-ref-format "$MOD_SOURCE_REF" >/dev/null; then
              echo "::error::mod_source_ref must be a valid branch, tag, or Git ref."
              exit 1
            fi
          fi

      ######################################################################
      # Resolve APWorld source
      ######################################################################

      - name: Resolve APWorld source
        id: world
        env:
          BRANCH: ${{ github.ref_name }}
          BUILD_ENVIRONMENT: ${{ inputs.build_environment }}
          APWORLD_PATH_OVERRIDE: ${{ inputs.apworld_path }}
        run: |
          python <<'PY'
          import os
          import re
          from pathlib import Path

          branch = os.environ["BRANCH"]
          build_environment = os.environ["BUILD_ENVIRONMENT"]
          override = os.environ["APWORLD_PATH_OVERRIDE"].strip()
          
          # --------------------------------------------------------------
          # Resolve source directory and optional APWorld name
          # --------------------------------------------------------------
          
          override_name = None
          
          if override:
              if ":" in override:
                  override_path, override_name = override.rsplit(":", 1)
                  override_path = override_path.strip()
                  override_name = override_name.strip()
          
                  if not override_path:
                      override_path = "."
              else:
                  override_path = override
          
              source_dir = Path(override_path)
          
              # GitHub workflow input paths must stay inside the repository.
              if source_dir.is_absolute():
                  raise SystemExit(
                      f"APWorld path must be relative to the repository root: {override_path}"
                  )
          
              normalized_parts = source_dir.parts
          
              if ".." in normalized_parts:
                  raise SystemExit(
                      f"APWorld path may not contain '..': {override_path}"
                  )
          
              if str(source_dir) in ("", "."):
                  source_dir = Path(".")
          else:
              if build_environment == "local":
                  source_dir = Path("worlds") / branch
              else:
                  source_dir = Path(".")
          
          if not source_dir.is_dir():
              raise SystemExit(
                  f"APWorld source directory does not exist: {source_dir}"
              )
          
          # --------------------------------------------------------------
          # Resolve APWorld name
          # --------------------------------------------------------------
          
          if override_name:
              world = override_name
          elif override and source_dir != Path("."):
              world = source_dir.name
          else:
              world = branch
          
          if not re.fullmatch(r"[A-Za-z0-9_-]+", world):
              raise SystemExit(
                  f"Invalid APWorld name: {world}"
              )

          manifest_path = source_dir / "archipelago.json"

          print(f"Build environment : {build_environment}")
          print(f"Branch            : {branch}")
          print(f"APWorld name      : {world}")
          print(f"Source directory  : {source_dir}")
          print(f"Manifest path     : {manifest_path}")

          print("")
          print("APWorld source files:")
          for path in sorted(source_dir.rglob("*")):
              if path.is_file():
                  print(f"  {path}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print(f"world={world}", file=f)
              print(
                  f"source_dir={source_dir.as_posix()}",
                  file=f,
              )
              print(
                  f"manifest_path={manifest_path.as_posix()}",
                  file=f,
              )
          PY

      ######################################################################
      # Get latest stable Archipelago release
      ######################################################################

      - name: Get latest stable Archipelago release
        id: stable_ap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh api \
            repos/ArchipelagoMW/Archipelago/releases/latest \
            --jq '.tag_name')

          if [ -z "$TAG" ]; then
            echo "::error::Could not determine latest stable Archipelago release."
            exit 1
          fi

          VERSION="${TAG#v}"

          echo "Latest stable Archipelago tag: $TAG"
          echo "Latest stable Archipelago version: $VERSION"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      ######################################################################
      # Prepare Archipelago build environment
      ######################################################################

      - name: Prepare local build environment
        if: inputs.build_environment == 'local'
        id: build
        run: |
          echo "Using current repository as the Archipelago build environment."
          echo "build_root=." >> "$GITHUB_OUTPUT"

      - name: Prepare latest-release Archipelago environment
        if: inputs.build_environment == 'latest'
        id: build_release
        env:
          RELEASE_TAG: ${{ steps.stable_ap.outputs.tag }}
        run: |
          rm -rf .archipelago-build

          echo "Cloning Archipelago release: $RELEASE_TAG"

          git clone \
            --depth 1 \
            --branch "$RELEASE_TAG" \
            https://github.com/ArchipelagoMW/Archipelago.git \
            .archipelago-build

          echo "Archipelago revision:"
          git -C .archipelago-build log -1 --oneline

          echo "build_root=.archipelago-build" >> "$GITHUB_OUTPUT"

      - name: Prepare main Archipelago environment
        if: inputs.build_environment == 'main'
        id: build_main
        run: |
          rm -rf .archipelago-build
      
          echo "Cloning Archipelago main."
      
          git clone \
            --depth 1 \
            --branch main \
            https://github.com/ArchipelagoMW/Archipelago.git \
            .archipelago-build
      
          echo "Archipelago revision:"
          git -C .archipelago-build log -1 --oneline
      
          echo "build_root=.archipelago-build" >> "$GITHUB_OUTPUT"

      ######################################################################
      # Select build root
      ######################################################################

      - name: Select build root
        id: build_root
        env:
          BUILD_ENVIRONMENT: ${{ inputs.build_environment }}
          LOCAL_BUILD_ROOT: ${{ steps.build.outputs.build_root }}
          RELEASE_BUILD_ROOT: ${{ steps.build_release.outputs.build_root }}
          MAIN_BUILD_ROOT: ${{ steps.build_main.outputs.build_root }}
        run: |
          case "$BUILD_ENVIRONMENT" in
            local)
              BUILD_ROOT="$LOCAL_BUILD_ROOT"
              ;;
      
            latest)
              BUILD_ROOT="$RELEASE_BUILD_ROOT"
              ;;
      
            main)
              BUILD_ROOT="$MAIN_BUILD_ROOT"
              ;;
      
            *)
              echo "::error::Unknown build environment: $BUILD_ENVIRONMENT"
              exit 1
              ;;
          esac
      
          if [ -z "$BUILD_ROOT" ]; then
            echo "::error::Build root was not resolved."
            exit 1
          fi
      
          echo "Build root: $BUILD_ROOT"
      
          echo "build_root=$BUILD_ROOT" >> "$GITHUB_OUTPUT"

      ######################################################################
      # Python
      ######################################################################

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      ######################################################################
      # Stage APWorld into selected Archipelago build environment
      ######################################################################

      - name: Stage APWorld for upstream build
        if: inputs.build_environment != 'local'
        env:
          BUILD_ROOT: ${{ steps.build_root.outputs.build_root }}
          WORLD: ${{ steps.world.outputs.world }}
          SOURCE_DIR: ${{ steps.world.outputs.source_dir }}
        run: |
          DESTINATION="$BUILD_ROOT/worlds/$WORLD"

          echo "Source APWorld : $SOURCE_DIR"
          echo "Build directory: $DESTINATION"

          rm -rf "$DESTINATION"
          mkdir -p "$DESTINATION"

          rsync -a \
            --exclude='.archipelago-build/' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='.idea/' \
            --exclude='release_notes.md' \
            --exclude='release_files/' \
            --exclude='build/' \
            --exclude='.pytest_cache/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            "$SOURCE_DIR/" \
            "$DESTINATION/"

          echo ""
          echo "Staged APWorld:"
          find "$DESTINATION" -maxdepth 3 -type f | sort

      - name: Verify local APWorld
        if: inputs.build_environment == 'local'
        env:
          WORLD: ${{ steps.world.outputs.world }}
          SOURCE_DIR: ${{ steps.world.outputs.source_dir }}
        run: |
          EXPECTED="worlds/$WORLD"

          if [ "$SOURCE_DIR" != "$EXPECTED" ]; then
            echo "::error::Local build mode expects the APWorld at $EXPECTED."
            echo "::error::Resolved source directory was: $SOURCE_DIR"
            echo "::error::Use build_environment=local without an override,"
            echo "::error::or place the APWorld under worlds/$WORLD."
            exit 1
          fi

          if [ ! -d "$EXPECTED" ]; then
            echo "::error::APWorld directory does not exist: $EXPECTED"
            exit 1
          fi

          echo "Local APWorld:"
          find "$EXPECTED" -maxdepth 3 -type f | sort

      ######################################################################
      # Install Archipelago requirements
      ######################################################################

      - name: Show world-specific requirements
        env:
          BUILD_ROOT: ${{ steps.build_root.outputs.build_root }}
        working-directory: ${{ steps.build_root.outputs.build_root }}
        run: |
          echo "All requirements.txt files in build environment:"
          find . \
            -type f \
            -name requirements.txt \
            -print \
            | sort

          echo ""
          echo "platformdirs requirements:"
          grep -RIn \
            --include='requirements.txt' \
            'platformdirs' \
            . \
            || true

      - name: Install Archipelago requirements
        env:
          BUILD_ROOT: ${{ steps.build_root.outputs.build_root }}
        working-directory: ${{ steps.build_root.outputs.build_root }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools>=75,<81"
      
          python -c "import pkg_resources; print('pkg_resources OK')"
      
          python ModuleUpdate.py --yes --force
      
          python -m pip install \
            --upgrade \
            --force-reinstall \
            typing_extensions==4.15.0

      - name: Read Archipelago version
        id: ap_version
        env:
          BUILD_ROOT: ${{ steps.build_root.outputs.build_root }}
        working-directory: ${{ steps.build_root.outputs.build_root }}
        run: |
          python - <<'PY'
          import os
          from Utils import __version__
      
          print(f"Archipelago version: {__version__}")
      
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print(f"version={__version__}", file=f)
          PY

      ######################################################################
      # Resolve selected fuzzer preset
      ######################################################################

      - name: Resolve fuzzer preset
        id: fuzzer_preset
        env:
          FUZZER_PRESET: ${{ inputs.fuzzer_preset }}
        run: |
          python <<'PY'
          import os

          fuzzers = (
              "normal",
              "determinism",
              "no_restrictive_starts",
              "check_collect_accessibility",
              "check_gerpocalypse",
              "check_indirect_conditions",
              "check_item_location_count",
              "check_lambda_capture",
              "check_placement_item_location_refs",
              "check_static_output_placement",
              "ut",
              "yamlless_ut",
          )

          def preset(**overrides):
              config = dict.fromkeys(fuzzers, 0)
              config.update(overrides)
              return config

          # Add or edit presets here. Every fuzzer defaults to disabled.
          presets = {
              "None": preset(),
              "Smoke": preset(
                  normal=10,
                  determinism=5,
                  check_collect_accessibility=5,
              ),
              "All at 100": {name: 100 for name in fuzzers},
              "All at 500": {name: 500 for name in fuzzers},
              "All at 1000": {name: 1000 for name in fuzzers},
              "Normal only at 100": preset(normal=100),
          }

          selected = os.environ["FUZZER_PRESET"]
          if selected not in presets:
              raise SystemExit(f"Unknown fuzzer preset: {selected}")

          config = presets[selected]
          print(f"Selected fuzzer preset: {selected}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for name in fuzzers:
                  print(f"{name}={config[name]}", file=output)
                  print(f"{name}: {config[name]} runs")
          PY

      ######################################################################
      # Prepare fuzzer support
      ######################################################################

      - name: Prepare fuzzer support
        if: ${{ steps.fuzzer_preset.outputs.normal > 0 || steps.fuzzer_preset.outputs.determinism > 0 || steps.fuzzer_preset.outputs.no_restrictive_starts > 0 || steps.fuzzer_preset.outputs.check_collect_accessibility > 0 || steps.fuzzer_preset.outputs.check_gerpocalypse > 0 || steps.fuzzer_preset.outputs.check_indirect_conditions > 0 || steps.fuzzer_preset.outputs.check_item_location_count > 0 || steps.fuzzer_preset.outputs.check_lambda_capture > 0 || steps.fuzzer_preset.outputs.check_placement_item_location_refs > 0 || steps.fuzzer_preset.outputs.check_static_output_placement > 0 || steps.fuzzer_preset.outputs.ut > 0 || steps.fuzzer_preset.outputs.yamlless_ut > 0 }}
        id: fuzzer_support
        env:
          BUILD_ROOT: ${{ steps.build_root.outputs.build_root }}
          DETERMINISM_RUNS: ${{ steps.fuzzer_preset.outputs.determinism }}
          NO_RESTRICTIVE_STARTS_RUNS: ${{ steps.fuzzer_preset.outputs.no_restrictive_starts }}
          CHECK_COLLECT_ACCESSIBILITY_RUNS: ${{ steps.fuzzer_preset.outputs.check_collect_accessibility }}
          CHECK_GERPOCALYPSE_RUNS: ${{ steps.fuzzer_preset.outputs.check_gerpocalypse }}
          CHECK_INDIRECT_CONDITIONS_RUNS: ${{ steps.fuzzer_preset.outputs.check_indirect_conditions }}
          CHECK_ITEM_LOCATION_COUNT_RUNS: ${{ steps.fuzzer_preset.outputs.check_item_location_count }}
          CHECK_LAMBDA_CAPTURE_RUNS: ${{ steps.fuzzer_preset.outputs.check_lambda_capture }}
          CHECK_PLACEMENT_ITEM_LOCATION_REFS_RUNS: ${{ steps.fuzzer_preset.outputs.check_placement_item_location_refs }}
          CHECK_STATIC_OUTPUT_PLACEMENT_RUNS: ${{ steps.fuzzer_preset.outputs.check_static_output_placement }}
          UT_RUNS: ${{ steps.fuzzer_preset.outputs.ut }}
          YAMLLESS_UT_RUNS: ${{ steps.fuzzer_preset.outputs.yamlless_ut }}
          USE_FUZZER_META: ${{ inputs.use_fuzzer_meta }}
          FUZZER_META: ${{ github.workspace }}/meta.yaml
        run: |
          FUZZER_SOURCE="$RUNNER_TEMP/archipelago-fuzzer"
          TRACKER_SOURCE="$RUNNER_TEMP/archipelago-tracker"

          rm -rf "$FUZZER_SOURCE" "$TRACKER_SOURCE"

          echo "Downloading Archipelago fuzzer..."

          git clone \
            --depth 1 \
            --branch workflow \
            https://github.com/jacobmix/Archipelago-fuzzer.git \
            "$FUZZER_SOURCE"

          cp \
            "$FUZZER_SOURCE/fuzz.py" \
            "$BUILD_ROOT/fuzz.py"

          if [ "$USE_FUZZER_META" = "true" ]; then
            if [ ! -f "$FUZZER_META" ]; then
              echo "::error::use_fuzzer_meta is enabled, but no meta.yaml exists at the repository root."
              exit 1
            fi

            echo "Using fuzzer meta.yaml:"
            echo "  $FUZZER_META"
          fi

          if [ "$DETERMINISM_RUNS" -gt 0 ]; then
            mkdir -p "$BUILD_ROOT/hooks"

            cp \
              "$FUZZER_SOURCE/hooks/determinism.py" \
              "$BUILD_ROOT/hooks/determinism.py"
          fi

          if [ "$NO_RESTRICTIVE_STARTS_RUNS" -gt 0 ]; then
            mkdir -p "$BUILD_ROOT/hooks"
            cp "$FUZZER_SOURCE/hooks/with_empty.py" \
               "$BUILD_ROOT/hooks/with_empty.py"

            # The upstream hook expects an Empty APWorld from its /ap container.
            # Register a temporary empty loose world for this GitHub Actions runner.
            EMPTY_WORLD_DIR="$BUILD_ROOT/worlds/empty"
            if [ ! -e "$EMPTY_WORLD_DIR" ]; then
              mkdir -p "$EMPTY_WORLD_DIR"
              cat > "$EMPTY_WORLD_DIR/__init__.py" <<'EMPTY_WORLD_PY'
          from worlds.AutoWorld import World

          class EmptyWorld(World):
              game = "Empty"
              item_name_to_id = {}
              location_name_to_id = {}
          EMPTY_WORLD_PY
              touch "$EMPTY_WORLD_DIR/.apworld-release-fuzzer-fixture"
              echo "Installed temporary Empty world for no-restrictive-starts fuzzing."
            else
              echo "Using existing $EMPTY_WORLD_DIR for no-restrictive-starts fuzzing."
            fi
          fi

          if [ "$CHECK_COLLECT_ACCESSIBILITY_RUNS" -gt 0 ]; then
            mkdir -p "$BUILD_ROOT/hooks"
            cp "$FUZZER_SOURCE/hooks/collect_accessibility_test.py" \
               "$BUILD_ROOT/hooks/collect_accessibility_test.py"
          fi

          if [ "$CHECK_GERPOCALYPSE_RUNS" -gt 0 ]; then
            mkdir -p "$BUILD_ROOT/hooks"
            cp "$FUZZER_SOURCE/hooks/gerpocalypse.py" \
               "$BUILD_ROOT/hooks/gerpocalypse.py"
          fi

          if [ "$CHECK_INDIRECT_CONDITIONS_RUNS" -gt 0 ]; then
            mkdir -p "$BUILD_ROOT/hooks"
            cp "$FUZZER_SOURCE/hooks/indirect_conditions.py" \
               "$BUILD_ROOT/hooks/indirect_conditions.py"
          fi

          if [ "$CHECK_ITEM_LOCATION_COUNT_RUNS" -gt 0 ]; then
            mkdir -p "$BUILD_ROOT/hooks"
            cp "$FUZZER_SOURCE/hooks/item_location_count.py" \
               "$BUILD_ROOT/hooks/item_location_count.py"
          fi

          if [ "$CHECK_LAMBDA_CAPTURE_RUNS" -gt 0 ]; then
            mkdir -p "$BUILD_ROOT/hooks"
            cp "$FUZZER_SOURCE/hooks/detect_rule_variable_capture_issues.py" \
               "$BUILD_ROOT/hooks/detect_rule_variable_capture_issues.py"
          fi

          if [ "$CHECK_PLACEMENT_ITEM_LOCATION_REFS_RUNS" -gt 0 ]; then
            mkdir -p "$BUILD_ROOT/hooks"
            cp "$FUZZER_SOURCE/hooks/check_placement_item_location_references.py" \
               "$BUILD_ROOT/hooks/check_placement_item_location_references.py"
          fi

          if [ "$CHECK_STATIC_OUTPUT_PLACEMENT_RUNS" -gt 0 ]; then
            mkdir -p "$BUILD_ROOT/hooks"
            cp "$FUZZER_SOURCE/hooks/detect_output_placement_changes.py" \
               "$BUILD_ROOT/hooks/detect_output_placement_changes.py"
          fi

          if [ "$UT_RUNS" -gt 0 ] || [ "$YAMLLESS_UT_RUNS" -gt 0 ]; then
            echo "Downloading Universal Tracker world..."

            git clone \
              --depth 1 \
              --filter=blob:none \
              --sparse \
              --branch tracker \
              https://github.com/FarisTheAncient/Archipelago.git \
              "$TRACKER_SOURCE"

            git -C "$TRACKER_SOURCE" sparse-checkout set worlds/tracker

            if [ -e "$BUILD_ROOT/worlds/tracker" ]; then
              echo "::error::Build environment already contains worlds/tracker."
              exit 1
            fi

            mkdir -p "$BUILD_ROOT/worlds"

            cp -a \
              "$TRACKER_SOURCE/worlds/tracker" \
              "$BUILD_ROOT/worlds/tracker"
          fi

          python -m py_compile "$BUILD_ROOT/fuzz.py"


          ##################################################################
          # Verify installed files
          ##################################################################

          echo ""
          echo "Fuzzer files:"

          if [ -f "$BUILD_ROOT/fuzz.py" ]; then
            echo "  $BUILD_ROOT/fuzz.py"
          else
            echo "::error::fuzz.py was not installed."
            exit 1
          fi

          if [ "$DETERMINISM_RUNS" -gt 0 ]; then
            if [ -f "$BUILD_ROOT/hooks/determinism.py" ]; then
              echo "  $BUILD_ROOT/hooks/determinism.py"
            else
              echo "::error::Determinism hook was not installed."
              exit 1
            fi
          fi

          if [ "$NO_RESTRICTIVE_STARTS_RUNS" -gt 0 ]; then
            if [ -f "$BUILD_ROOT/hooks/with_empty.py" ]; then
              echo "  $BUILD_ROOT/hooks/with_empty.py"
            else
              echo "::error::No-restrictive-starts hook was not installed."
              exit 1
            fi
          fi

          if [ "$CHECK_COLLECT_ACCESSIBILITY_RUNS" -gt 0 ]; then
            if [ -f "$BUILD_ROOT/hooks/collect_accessibility_test.py" ]; then
              echo "  $BUILD_ROOT/hooks/collect_accessibility_test.py"
            else
              echo "::error::Collect-accessibility hook was not installed."
              exit 1
            fi
          fi

          if [ "$CHECK_GERPOCALYPSE_RUNS" -gt 0 ]; then
            if [ -f "$BUILD_ROOT/hooks/gerpocalypse.py" ]; then
              echo "  $BUILD_ROOT/hooks/gerpocalypse.py"
            else
              echo "::error::GERPocalypse hook was not installed."
              exit 1
            fi
          fi

          if [ "$CHECK_INDIRECT_CONDITIONS_RUNS" -gt 0 ]; then
            if [ -f "$BUILD_ROOT/hooks/indirect_conditions.py" ]; then
              echo "  $BUILD_ROOT/hooks/indirect_conditions.py"
            else
              echo "::error::Indirect-conditions hook was not installed."
              exit 1
            fi
          fi

          if [ "$CHECK_ITEM_LOCATION_COUNT_RUNS" -gt 0 ]; then
            if [ -f "$BUILD_ROOT/hooks/item_location_count.py" ]; then
              echo "  $BUILD_ROOT/hooks/item_location_count.py"
            else
              echo "::error::Item-location-count hook was not installed."
              exit 1
            fi
          fi

          if [ "$CHECK_LAMBDA_CAPTURE_RUNS" -gt 0 ]; then
            if [ -f "$BUILD_ROOT/hooks/detect_rule_variable_capture_issues.py" ]; then
              echo "  $BUILD_ROOT/hooks/detect_rule_variable_capture_issues.py"
            else
              echo "::error::Lambda-capture hook was not installed."
              exit 1
            fi
          fi

          if [ "$CHECK_PLACEMENT_ITEM_LOCATION_REFS_RUNS" -gt 0 ]; then
            if [ -f "$BUILD_ROOT/hooks/check_placement_item_location_references.py" ]; then
              echo "  $BUILD_ROOT/hooks/check_placement_item_location_references.py"
            else
              echo "::error::Placement-item-location-reference hook was not installed."
              exit 1
            fi
          fi

          if [ "$CHECK_STATIC_OUTPUT_PLACEMENT_RUNS" -gt 0 ]; then
            if [ -f "$BUILD_ROOT/hooks/detect_output_placement_changes.py" ]; then
              echo "  $BUILD_ROOT/hooks/detect_output_placement_changes.py"
            else
              echo "::error::Static-output-placement hook was not installed."
              exit 1
            fi
          fi

          if [ "$UT_RUNS" -gt 0 ] || [ "$YAMLLESS_UT_RUNS" -gt 0 ]; then
            if [ -f "$BUILD_ROOT/worlds/tracker/fuzzer_hook.py" ] && \
               [ -f "$BUILD_ROOT/worlds/tracker/TrackerCore.py" ] && \
               [ -f "$BUILD_ROOT/worlds/tracker/__init__.py" ]; then
              echo "  $BUILD_ROOT/worlds/tracker/"
            else
              echo "::error::Universal Tracker support was not installed correctly."
              exit 1
            fi
          fi

      ######################################################################
      # Determine APWorld readiness
      ######################################################################

      - name: Determine APWorld readiness
        id: readiness
        env:
          GH_TOKEN: ${{ github.token }}
          WORLD: ${{ steps.world.outputs.world }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          RELEASES=$(gh release list \
            --limit 200 \
            --json tagName,isDraft,isPrerelease \
            --jq "
              [
                .[]
                | select(.isDraft == false)
                | select(.tagName | startswith(\"${WORLD}-v\"))
              ]
            ")

          STABLE_COUNT=$(jq \
            '[.[] | select(.isPrerelease == false)] | length' \
            <<< "$RELEASES")

          PRERELEASE_COUNT=$(jq \
            '[.[] | select(.isPrerelease == true)] | length' \
            <<< "$RELEASES")

          ADD_UNREADY=false
          REMOVE_UNREADY=false

          # No stable release exists yet and the release being created
          # is a prerelease -> world is still unready.
          if [ "$STABLE_COUNT" -eq 0 ] && \
             [ "$PRERELEASE" = "true" ]; then
            ADD_UNREADY=true
          fi

          # The world previously had only prereleases and we are now
          # creating the first stable release -> remove unready.
          if [ "$STABLE_COUNT" -eq 0 ] && \
             [ "$PRERELEASE_COUNT" -gt 0 ] && \
             [ "$PRERELEASE" = "false" ]; then
            REMOVE_UNREADY=true
          fi

          echo "Stable releases:     $STABLE_COUNT"
          echo "Prerelease releases: $PRERELEASE_COUNT"
          echo "Add unready:         $ADD_UNREADY"
          echo "Remove unready:      $REMOVE_UNREADY"

          echo "add_unready=$ADD_UNREADY" >> "$GITHUB_OUTPUT"
          echo "remove_unready=$REMOVE_UNREADY" >> "$GITHUB_OUTPUT"

      ######################################################################
      # Read / create / update manifest
      ######################################################################

      - name: Update APWorld manifest
        id: manifest
        env:
          WORLD: ${{ steps.world.outputs.world }}
          SOURCE_DIR: ${{ steps.world.outputs.source_dir }}
          BUMP: ${{ inputs.include_mod && inputs.release_scope == 'mod_only' && 'none' || inputs.bump }}
          OVERRIDE_VERSION: ${{ inputs.world_version }}
          IGNORE_WORLD_OVERRIDE: ${{ inputs.include_mod && inputs.release_scope == 'mod_only' }}
          GAME_OVERRIDE: ${{ inputs.game }}
          AUTHORS: ${{ inputs.authors }}
          MINIMUM: ${{ inputs.minimum_ap_version }}
          MAXIMUM: ${{ inputs.maximum_ap_version }}
          CLAMP: ${{ inputs.clamp_minimum_ap_version }}
          FLAGS_INPUT: ${{ inputs.flags }}
          ADD_UNREADY: ${{ steps.readiness.outputs.add_unready }}
          REMOVE_UNREADY: ${{ steps.readiness.outputs.remove_unready }}
          STABLE_AP: ${{ steps.stable_ap.outputs.version }}
        run: |
          python <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          world = os.environ["WORLD"]
          source_dir = Path(os.environ["SOURCE_DIR"])

          manifest_path = source_dir / "archipelago.json"

          # --------------------------------------------------------------
          # Read or create manifest
          # --------------------------------------------------------------

          if manifest_path.exists():
              print(f"Found manifest: {manifest_path}")

              try:
                  manifest = json.loads(
                      manifest_path.read_text(encoding="utf-8")
                  )
              except json.JSONDecodeError as exc:
                  raise SystemExit(
                      f"Invalid JSON in {manifest_path}: {exc}"
                  )

              if not isinstance(manifest, dict):
                  raise SystemExit(
                      f"{manifest_path} must contain a JSON object."
                  )

          else:
              print(f"No manifest found at {manifest_path}")

              manifest = {}

          # --------------------------------------------------------------
          # Ensure game exists
          # --------------------------------------------------------------

          if "game" not in manifest or not manifest["game"]:
              game_override = os.environ["GAME_OVERRIDE"]

              if not game_override:
                  raise SystemExit(
                      f"{manifest_path} has no 'game' field and no game "
                      "override was supplied."
                  )

              manifest["game"] = game_override
              print(f"Using game override: {game_override}")

          # --------------------------------------------------------------
          # Ensure world_version exists
          # --------------------------------------------------------------

          if "world_version" not in manifest:
              manifest["world_version"] = "0.0.0"

          original = json.loads(json.dumps(manifest))

          # --------------------------------------------------------------
          # world_version
          # --------------------------------------------------------------

          override_version = os.environ["OVERRIDE_VERSION"]

          if os.environ["IGNORE_WORLD_OVERRIDE"] == "true":
              override_version = ""

          if override_version:
              manifest["world_version"] = override_version

          elif os.environ["BUMP"] != "none":
              value = manifest["world_version"]

              try:
                  major, minor, patch = map(
                      int,
                      value.split("."),
                  )
              except ValueError:
                  raise SystemExit(
                      "world_version must use major.minor.patch format."
                  )

              bump = os.environ["BUMP"]

              if bump == "major":
                  major += 1
                  minor = 0
                  patch = 0

              elif bump == "minor":
                  minor += 1
                  patch = 0

              elif bump == "patch":
                  patch += 1

              manifest["world_version"] = (
                  f"{major}.{minor}.{patch}"
              )

          # --------------------------------------------------------------
          # Overrides
          # --------------------------------------------------------------

          if os.environ["GAME_OVERRIDE"]:
              manifest["game"] = os.environ["GAME_OVERRIDE"]

          if os.environ["MINIMUM"]:
              manifest["minimum_ap_version"] = os.environ["MINIMUM"]

          if os.environ["MAXIMUM"]:
              manifest["maximum_ap_version"] = os.environ["MAXIMUM"]

          if os.environ["AUTHORS"]:
              manifest["authors"] = [
                  author.strip()
                  for author in os.environ["AUTHORS"].split(",")
                  if author.strip()
              ]

          # --------------------------------------------------------------
          # Flags
          # --------------------------------------------------------------

          flags_input = os.environ["FLAGS_INPUT"].strip()

          existing_flags = manifest.get("flags", [])

          if not isinstance(existing_flags, list) or not all(
              isinstance(flag, str)
              for flag in existing_flags
          ):
              raise SystemExit(
                  "'flags' in archipelago.json must be a list of strings."
              )

          flags = existing_flags.copy()

          if flags_input:
              for flag in flags_input.split(","):
                  flag = flag.strip()

                  if not flag:
                      continue

                  if not re.fullmatch(r"[A-Za-z0-9_-]+", flag):
                      raise SystemExit(
                          f"Invalid manifest flag: {flag}"
                      )

                  if flag not in flags:
                      flags.append(flag)

          # --------------------------------------------------------------
          # Automatic unready handling
          # --------------------------------------------------------------

          if os.environ["ADD_UNREADY"] == "true":
              if "unready" not in flags:
                  flags.append("unready")

          elif os.environ["REMOVE_UNREADY"] == "true":
              flags = [
                  flag
                  for flag in flags
                  if flag != "unready"
              ]

          if flags or "flags" in manifest:
              manifest["flags"] = flags

          # --------------------------------------------------------------
          # Clamp minimum AP version
          # --------------------------------------------------------------

          def parse_version(value: str):
              try:
                  return tuple(map(int, value.split(".")))
              except ValueError:
                  raise SystemExit(
                      f"Invalid Archipelago version: {value}"
                  )

          if (
              os.environ["CLAMP"] == "true"
              and "minimum_ap_version" in manifest
          ):
              stable = os.environ["STABLE_AP"]

              if (
                  parse_version(manifest["minimum_ap_version"])
                  > parse_version(stable)
              ):
                  manifest["minimum_ap_version"] = stable

          # --------------------------------------------------------------
          # Save
          # --------------------------------------------------------------

          manifest_path.write_text(
              json.dumps(manifest, indent=4) + "\n",
              encoding="utf-8",
          )

          print("")
          print("Manifest")
          print("=" * 70)

          for key in (
              "game",
              "world_version",
              "minimum_ap_version",
              "maximum_ap_version",
              "authors",
          ):
              old = original.get(key, "<unset>")
              new = manifest.get(key, "<unset>")

              if old != new:
                  print(f"{key}:")
                  print(f"  {old}")
                  print(f"  -> {new}")
              else:
                  print(f"{key}: unchanged")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print(f"game={manifest['game']}", file=f)
              print(
                  f"world_version={manifest['world_version']}",
                  file=f,
              )
              print(
                  f"manifest_path={manifest_path.as_posix()}",
                  file=f,
              )
          PY

      ######################################################################
      # Generate player templates
      ######################################################################

      - name: Generate player templates
        if: ${{ inputs.run_generation || inputs.include_player_yaml }}
        env:
          BUILD_ROOT: ${{ steps.build_root.outputs.build_root }}
          GAME: ${{ steps.manifest.outputs.game }}
          WORLD: ${{ steps.world.outputs.world }}
          WORLD_VERSION: ${{ steps.manifest.outputs.world_version }}
          AP_VERSION: ${{ steps.ap_version.outputs.version }}
          INCLUDE_PLAYER_YAML: ${{ inputs.include_player_yaml }}
          RUN_GENERATION: ${{ inputs.run_generation }}
        working-directory: ${{ steps.build_root.outputs.build_root }}
        run: |
          python Launcher.py --update_settings
          python Launcher.py "Generate Template Options"

          python <<'PY'
          import os
          import re
          import shutil
          from pathlib import Path

          game = os.environ["GAME"]
          world = os.environ["WORLD"]
          world_version = os.environ["WORLD_VERSION"]
          ap_version = os.environ["AP_VERSION"]

          include_player_yaml = (
              os.environ["INCLUDE_PLAYER_YAML"] == "true"
          )

          run_generation = (
              os.environ["RUN_GENERATION"] == "true"
          )

          templates = Path("Players/Templates")
          players = Path("Players")

          game_template = templates / f"{game}.yaml"

          if not game_template.exists():
              raise SystemExit(
                  f"Expected generated player template at {game_template}"
              )

          # --------------------------------------------------------------
          # Prepare template for multiworld generation
          # --------------------------------------------------------------

          if run_generation:
              apquest_template = templates / "APQuest.yaml"

              if not apquest_template.exists():
                  raise SystemExit(
                      f"Expected APQuest template at {apquest_template}"
                  )

              shutil.copy2(
                  apquest_template,
                  players / "APQuest Test Base.yaml",
              )

              shutil.copy2(
                  game_template,
                  players / f"{game}.yaml",
              )

          # --------------------------------------------------------------
          # Prepare release player YAML
          # --------------------------------------------------------------

          if include_player_yaml:
              text = game_template.read_text(
                  encoding="utf-8"
              )

              # Replace only requires.version.
              text, count = re.subn(
                  r"(?m)^(\s+version:\s*)[^#\r\n]+",
                  rf"\g<1>{ap_version}",
                  text,
                  count=1,
              )

              if count != 1:
                  raise SystemExit(
                      "Could not find requires.version in generated "
                      "player template."
                  )

              # Extract only the requires section.
              requires_match = re.search(
                  r"(?ms)^requires:\s*\n(.*?)(?=^[^\s]|\Z)",
                  text,
              )

              if not requires_match:
                  raise SystemExit(
                      "Could not find requires section in generated "
                      "player template."
                  )

              requires = requires_match.group(0)

              # Replace only requires.game.<GAME>.
              game_pattern = (
                  rf"(?m)^(\s+{re.escape(game)}:\s*)[^#\r\n]+"
              )

              requires_new, count = re.subn(
                  game_pattern,
                  rf"\g<1>{world_version}",
                  requires,
                  count=1,
              )

              if count != 1:
                  raise SystemExit(
                      f"Could not find requires.game.{game} in generated "
                      "player template."
                  )

              text = (
                  text[:requires_match.start()]
                  + requires_new
                  + text[requires_match.end():]
              )

              output_path = (
                  Path(os.environ["GITHUB_WORKSPACE"])
                  / f"{world}.yaml"
              )

              output_path.write_text(
                  text,
                  encoding="utf-8",
              )

              print(
                  f"Generated release player template: {output_path}"
              )

              print("")
              print(text)
          PY

      ######################################################################
      # Run multiworld generation
      ######################################################################

      - name: Run multiworld generation
        if: ${{ inputs.run_generation }}
        env:
          BUILD_ROOT: ${{ steps.build_root.outputs.build_root }}
        working-directory: ${{ steps.build_root.outputs.build_root }}
        run: |
          python Launcher.py "Generate"

      ######################################################################
      # Run normal APWorld fuzzer
      ######################################################################

      - name: Run fuzzer
        if: ${{ !cancelled() && steps.fuzzer_preset.outputs.normal > 0 && steps.fuzzer_support.outcome == 'success' }}
        env:
          BUILD_ROOT: ${{ steps.build_root.outputs.build_root }}
          WORLD: ${{ steps.world.outputs.world }}
          GAME: ${{ steps.manifest.outputs.game }}
          FUZZER_RUNS: ${{ steps.fuzzer_preset.outputs.normal }}
          FUZZER_JOBS: ${{ inputs.fuzzer_jobs }}
          FUZZER_TIMEOUT: ${{ inputs.fuzzer_timeout }}
          USE_FUZZER_META: ${{ inputs.use_fuzzer_meta }}
          FUZZER_META: ${{ github.workspace }}/meta.yaml
          APFUZZ_OUT_DIR: fuzz_output/normal
        working-directory: ${{ steps.build_root.outputs.build_root }}
        run: |
          META_ARGS=()

          if [ "$USE_FUZZER_META" = "true" ]; then
            META_ARGS=(-m "$FUZZER_META")
          fi

          echo "Running APWorld fuzzer:"
          echo "  Game:    $GAME"
          echo "  World:   $WORLD"
          echo "  Runs:    $FUZZER_RUNS"
          echo "  Jobs:    $FUZZER_JOBS"
          echo "  Timeout: $FUZZER_TIMEOUT seconds"
          echo "  Output:  $APFUZZ_OUT_DIR"

          python -O fuzz.py \
            -r "$FUZZER_RUNS" \
            -j "$FUZZER_JOBS" \
            -t "$FUZZER_TIMEOUT" \
            -g "$WORLD" \
            "${META_ARGS[@]}"

      ######################################################################
      # Run determinism fuzzer
      ######################################################################

      - name: Run determinism fuzzer
        if: ${{ !cancelled() && steps.fuzzer_preset.outputs.determinism > 0 && steps.fuzzer_support.outcome == 'success' }}
        env:
          BUILD_ROOT: ${{ steps.build_root.outputs.build_root }}
          WORLD: ${{ steps.world.outputs.world }}
          GAME: ${{ steps.manifest.outputs.game }}
          FUZZER_RUNS: ${{ steps.fuzzer_preset.outputs.determinism }}
          FUZZER_JOBS: ${{ inputs.fuzzer_jobs }}
          FUZZER_TIMEOUT: ${{ inputs.fuzzer_timeout }}
          USE_FUZZER_META: ${{ inputs.use_fuzzer_meta }}
          FUZZER_META: ${{ github.workspace }}/meta.yaml
          APFUZZ_OUT_DIR: fuzz_output/determinism
        working-directory: ${{ steps.build_root.outputs.build_root }}
        run: |
          META_ARGS=()

          if [ "$USE_FUZZER_META" = "true" ]; then
            META_ARGS=(-m "$FUZZER_META")
          fi

          JOBS=$((FUZZER_JOBS / 2))

          if [ "$JOBS" -lt 1 ]; then
            JOBS=1
          fi

          TIMEOUT=$((FUZZER_TIMEOUT * 2))

          echo "Running determinism fuzzer:"
          echo "  Game:    $GAME"
          echo "  World:   $WORLD"
          echo "  Runs:    $FUZZER_RUNS"
          echo "  Jobs:    $JOBS"
          echo "  Timeout: $TIMEOUT seconds"
          echo "  Output:  $APFUZZ_OUT_DIR"

          python -O fuzz.py \
            -r "$FUZZER_RUNS" \
            -j "$JOBS" \
            -t "$TIMEOUT" \
            -g "$WORLD" \
            --hook hooks.determinism:Hook \
            "${META_ARGS[@]}"

      ######################################################################
      # Run no-restrictive-starts fuzzer
      ######################################################################

      - name: Run no-restrictive-starts fuzzer
        if: ${{ !cancelled() && steps.fuzzer_preset.outputs.no_restrictive_starts > 0 && steps.fuzzer_support.outcome == 'success' }}
        env:
          BUILD_ROOT: ${{ steps.build_root.outputs.build_root }}
          WORLD: ${{ steps.world.outputs.world }}
          GAME: ${{ steps.manifest.outputs.game }}
          FUZZER_RUNS: ${{ steps.fuzzer_preset.outputs.no_restrictive_starts }}
          FUZZER_JOBS: ${{ inputs.fuzzer_jobs }}
          FUZZER_TIMEOUT: ${{ inputs.fuzzer_timeout }}
          USE_FUZZER_META: ${{ inputs.use_fuzzer_meta }}
          FUZZER_META: ${{ github.workspace }}/meta.yaml
          APFUZZ_OUT_DIR: fuzz_output/no_restrictive_starts
        working-directory: ${{ steps.build_root.outputs.build_root }}
        run: |
          META_ARGS=()

          if [ "$USE_FUZZER_META" = "true" ]; then
            META_ARGS=(-m "$FUZZER_META")
          fi

          python -O fuzz.py \
            -r "$FUZZER_RUNS" \
            -j "$FUZZER_JOBS" \
            -t "$FUZZER_TIMEOUT" \
            -g "$WORLD" \
            --hook hooks.with_empty:Hook \
            "${META_ARGS[@]}"

      ######################################################################
      # Run collect-accessibility fuzzer
      ######################################################################

      - name: Run collect-accessibility fuzzer
        if: ${{ !cancelled() && steps.fuzzer_preset.outputs.check_collect_accessibility > 0 && steps.fuzzer_support.outcome == 'success' }}
        env:
          BUILD_ROOT: ${{ steps.build_root.outputs.build_root }}
          WORLD: ${{ steps.world.outputs.world }}
          GAME: ${{ steps.manifest.outputs.game }}
          FUZZER_RUNS: ${{ steps.fuzzer_preset.outputs.check_collect_accessibility }}
          FUZZER_JOBS: ${{ inputs.fuzzer_jobs }}
          FUZZER_TIMEOUT: ${{ inputs.fuzzer_timeout }}
          USE_FUZZER_META: ${{ inputs.use_fuzzer_meta }}
          FUZZER_META: ${{ github.workspace }}/meta.yaml
          APFUZZ_OUT_DIR: fuzz_output/check_collect_accessibility
        working-directory: ${{ steps.build_root.outputs.build_root }}
        run: |
          META_ARGS=()

          if [ "$USE_FUZZER_META" = "true" ]; then
            META_ARGS=(-m "$FUZZER_META")
          fi

          python -O fuzz.py \
            -r "$FUZZER_RUNS" \
            -j "$FUZZER_JOBS" \
            -t "$FUZZER_TIMEOUT" \
            -g "$WORLD" \
            --hook hooks.collect_accessibility_test:Hook \
            "${META_ARGS[@]}"

      ######################################################################
      # Run GERPocalypse fuzzer
      ######################################################################

      - name: Run GERPocalypse fuzzer
        if: ${{ !cancelled() && steps.fuzzer_preset.outputs.check_gerpocalypse > 0 && steps.fuzzer_support.outcome == 'success' }}
        env:
          BUILD_ROOT: ${{ steps.build_root.outputs.build_root }}
          WORLD: ${{ steps.world.outputs.world }}
          GAME: ${{ steps.manifest.outputs.game }}
          FUZZER_RUNS: ${{ steps.fuzzer_preset.outputs.check_gerpocalypse }}
          FUZZER_JOBS: ${{ inputs.fuzzer_jobs }}
          FUZZER_TIMEOUT: ${{ inputs.fuzzer_timeout }}
          USE_FUZZER_META: ${{ inputs.use_fuzzer_meta }}
          FUZZER_META: ${{ github.workspace }}/meta.yaml
          APFUZZ_OUT_DIR: fuzz_output/check_gerpocalypse
        working-directory: ${{ steps.build_root.outputs.build_root }}
        run: |
          META_ARGS=()

          if [ "$USE_FUZZER_META" = "true" ]; then
            META_ARGS=(-m "$FUZZER_META")
          fi

          python -O fuzz.py \
            -r "$FUZZER_RUNS" \
            -j "$FUZZER_JOBS" \
            -t "$FUZZER_TIMEOUT" \
            -g "$WORLD" \
            --hook hooks.gerpocalypse:Hook \
            "${META_ARGS[@]}"

      ######################################################################
      # Run indirect-conditions fuzzer
      ######################################################################

      - name: Run indirect-conditions fuzzer
        if: ${{ !cancelled() && steps.fuzzer_preset.outputs.check_indirect_conditions > 0 && steps.fuzzer_support.outcome == 'success' }}
        env:
          BUILD_ROOT: ${{ steps.build_root.outputs.build_root }}
          WORLD: ${{ steps.world.outputs.world }}
          GAME: ${{ steps.manifest.outputs.game }}
          FUZZER_RUNS: ${{ steps.fuzzer_preset.outputs.check_indirect_conditions }}
          FUZZER_JOBS: ${{ inputs.fuzzer_jobs }}
          FUZZER_TIMEOUT: ${{ inputs.fuzzer_timeout }}
          USE_FUZZER_META: ${{ inputs.use_fuzzer_meta }}
          FUZZER_META: ${{ github.workspace }}/meta.yaml
          APFUZZ_OUT_DIR: fuzz_output/check_indirect_conditions
        working-directory: ${{ steps.build_root.outputs.build_root }}
        run: |
          META_ARGS=()

          if [ "$USE_FUZZER_META" = "true" ]; then
            META_ARGS=(-m "$FUZZER_META")
          fi

          python -O fuzz.py \
            -r "$FUZZER_RUNS" \
            -j "$FUZZER_JOBS" \
            -t "$FUZZER_TIMEOUT" \
            -g "$WORLD" \
            --hook hooks.indirect_conditions:Hook \
            "${META_ARGS[@]}"

      ######################################################################
      # Run item-location-count fuzzer
      ######################################################################

      - name: Run item-location-count fuzzer
        if: ${{ !cancelled() && steps.fuzzer_preset.outputs.check_item_location_count > 0 && steps.fuzzer_support.outcome == 'success' }}
        env:
          BUILD_ROOT: ${{ steps.build_root.outputs.build_root }}
          WORLD: ${{ steps.world.outputs.world }}
          GAME: ${{ steps.manifest.outputs.game }}
          FUZZER_RUNS: ${{ steps.fuzzer_preset.outputs.check_item_location_count }}
          FUZZER_JOBS: ${{ inputs.fuzzer_jobs }}
          FUZZER_TIMEOUT: ${{ inputs.fuzzer_timeout }}
          USE_FUZZER_META: ${{ inputs.use_fuzzer_meta }}
          FUZZER_META: ${{ github.workspace }}/meta.yaml
          APFUZZ_OUT_DIR: fuzz_output/check_item_location_count
        working-directory: ${{ steps.build_root.outputs.build_root }}
        run: |
          META_ARGS=()

          if [ "$USE_FUZZER_META" = "true" ]; then
            META_ARGS=(-m "$FUZZER_META")
          fi

          python -O fuzz.py \
            -r "$FUZZER_RUNS" \
            -j "$FUZZER_JOBS" \
            -t "$FUZZER_TIMEOUT" \
            -g "$WORLD" \
            --hook hooks.item_location_count:Hook \
            "${META_ARGS[@]}"

      ######################################################################
      # Run lambda-capture fuzzer
      ######################################################################

      - name: Run lambda-capture fuzzer
        if: ${{ !cancelled() && steps.fuzzer_preset.outputs.check_lambda_capture > 0 && steps.fuzzer_support.outcome == 'success' }}
        env:
          BUILD_ROOT: ${{ steps.build_root.outputs.build_root }}
          WORLD: ${{ steps.world.outputs.world }}
          GAME: ${{ steps.manifest.outputs.game }}
          FUZZER_RUNS: ${{ steps.fuzzer_preset.outputs.check_lambda_capture }}
          FUZZER_JOBS: ${{ inputs.fuzzer_jobs }}
          FUZZER_TIMEOUT: ${{ inputs.fuzzer_timeout }}
          USE_FUZZER_META: ${{ inputs.use_fuzzer_meta }}
          FUZZER_META: ${{ github.workspace }}/meta.yaml
          APFUZZ_OUT_DIR: fuzz_output/check_lambda_capture
        working-directory: ${{ steps.build_root.outputs.build_root }}
        run: |
          META_ARGS=()

          if [ "$USE_FUZZER_META" = "true" ]; then
            META_ARGS=(-m "$FUZZER_META")
          fi

          python -O fuzz.py \
            -r "$FUZZER_RUNS" \
            -j "$FUZZER_JOBS" \
            -t "$FUZZER_TIMEOUT" \
            -g "$WORLD" \
            --hook hooks.detect_rule_variable_capture_issues:Hook \
            "${META_ARGS[@]}"

      ######################################################################
      # Run placement-item-location-reference fuzzer
      ######################################################################

      - name: Run placement-item-location-reference fuzzer
        if: ${{ !cancelled() && steps.fuzzer_preset.outputs.check_placement_item_location_refs > 0 && steps.fuzzer_support.outcome == 'success' }}
        env:
          BUILD_ROOT: ${{ steps.build_root.outputs.build_root }}
          WORLD: ${{ steps.world.outputs.world }}
          GAME: ${{ steps.manifest.outputs.game }}
          FUZZER_RUNS: ${{ steps.fuzzer_preset.outputs.check_placement_item_location_refs }}
          FUZZER_JOBS: ${{ inputs.fuzzer_jobs }}
          FUZZER_TIMEOUT: ${{ inputs.fuzzer_timeout }}
          USE_FUZZER_META: ${{ inputs.use_fuzzer_meta }}
          FUZZER_META: ${{ github.workspace }}/meta.yaml
          APFUZZ_OUT_DIR: fuzz_output/check_placement_item_location_refs
        working-directory: ${{ steps.build_root.outputs.build_root }}
        run: |
          META_ARGS=()

          if [ "$USE_FUZZER_META" = "true" ]; then
            META_ARGS=(-m "$FUZZER_META")
          fi

          python -O fuzz.py \
            -r "$FUZZER_RUNS" \
            -j "$FUZZER_JOBS" \
            -t "$FUZZER_TIMEOUT" \
            -g "$WORLD" \
            --hook hooks.check_placement_item_location_references:Hook \
            "${META_ARGS[@]}"

      ######################################################################
      # Run static-output-placement fuzzer
      ######################################################################

      - name: Run static-output-placement fuzzer
        if: ${{ !cancelled() && steps.fuzzer_preset.outputs.check_static_output_placement > 0 && steps.fuzzer_support.outcome == 'success' }}
        env:
          BUILD_ROOT: ${{ steps.build_root.outputs.build_root }}
          WORLD: ${{ steps.world.outputs.world }}
          GAME: ${{ steps.manifest.outputs.game }}
          FUZZER_RUNS: ${{ steps.fuzzer_preset.outputs.check_static_output_placement }}
          FUZZER_JOBS: ${{ inputs.fuzzer_jobs }}
          FUZZER_TIMEOUT: ${{ inputs.fuzzer_timeout }}
          USE_FUZZER_META: ${{ inputs.use_fuzzer_meta }}
          FUZZER_META: ${{ github.workspace }}/meta.yaml
          APFUZZ_OUT_DIR: fuzz_output/check_static_output_placement
        working-directory: ${{ steps.build_root.outputs.build_root }}
        run: |
          META_ARGS=()

          if [ "$USE_FUZZER_META" = "true" ]; then
            META_ARGS=(-m "$FUZZER_META")
          fi

          python -O fuzz.py \
            -r "$FUZZER_RUNS" \
            -j "$FUZZER_JOBS" \
            -t "$FUZZER_TIMEOUT" \
            -g "$WORLD" \
            --hook hooks.detect_output_placement_changes:Hook \
            "${META_ARGS[@]}"

      ######################################################################
      # Run Universal Tracker fuzzer
      ######################################################################

      - name: Run UT fuzzer
        if: ${{ !cancelled() && steps.fuzzer_preset.outputs.ut > 0 && steps.fuzzer_support.outcome == 'success' }}
        env:
          BUILD_ROOT: ${{ steps.build_root.outputs.build_root }}
          WORLD: ${{ steps.world.outputs.world }}
          GAME: ${{ steps.manifest.outputs.game }}
          FUZZER_RUNS: ${{ steps.fuzzer_preset.outputs.ut }}
          FUZZER_JOBS: ${{ inputs.fuzzer_jobs }}
          FUZZER_TIMEOUT: ${{ inputs.fuzzer_timeout }}
          USE_FUZZER_META: ${{ inputs.use_fuzzer_meta }}
          FUZZER_META: ${{ github.workspace }}/meta.yaml
          APFUZZ_OUT_DIR: fuzz_output/ut
        working-directory: ${{ steps.build_root.outputs.build_root }}
        run: |
          META_ARGS=()

          if [ "$USE_FUZZER_META" = "true" ]; then
            META_ARGS=(-m "$FUZZER_META")
          fi

          echo "Running Universal Tracker fuzzer:"
          echo "  Game:    $GAME"
          echo "  World:   $WORLD"
          echo "  Runs:    $FUZZER_RUNS"
          echo "  Jobs:    $FUZZER_JOBS"
          echo "  Timeout: $FUZZER_TIMEOUT seconds"
          echo "  Output:  $APFUZZ_OUT_DIR"

          python -O fuzz.py \
            -r "$FUZZER_RUNS" \
            -j "$FUZZER_JOBS" \
            -t "$FUZZER_TIMEOUT" \
            -g "$WORLD" \
            --hook worlds.tracker.fuzzer_hook:Hook \
            "${META_ARGS[@]}"

      ######################################################################
      # Run Yamlless Universal Tracker fuzzer
      ######################################################################

      - name: Run Yamlless UT fuzzer
        if: ${{ !cancelled() && steps.fuzzer_preset.outputs.yamlless_ut > 0 && steps.fuzzer_support.outcome == 'success' }}
        env:
          BUILD_ROOT: ${{ steps.build_root.outputs.build_root }}
          WORLD: ${{ steps.world.outputs.world }}
          GAME: ${{ steps.manifest.outputs.game }}
          FUZZER_RUNS: ${{ steps.fuzzer_preset.outputs.yamlless_ut }}
          FUZZER_JOBS: ${{ inputs.fuzzer_jobs }}
          FUZZER_TIMEOUT: ${{ inputs.fuzzer_timeout }}
          USE_FUZZER_META: ${{ inputs.use_fuzzer_meta }}
          FUZZER_META: ${{ github.workspace }}/meta.yaml
          APFUZZ_OUT_DIR: fuzz_output/yamlless_ut
        working-directory: ${{ steps.build_root.outputs.build_root }}
        run: |
          META_ARGS=()

          if [ "$USE_FUZZER_META" = "true" ]; then
            META_ARGS=(-m "$FUZZER_META")
          fi

          echo "Running Yamlless Universal Tracker fuzzer:"
          echo "  Game:    $GAME"
          echo "  World:   $WORLD"
          echo "  Runs:    $FUZZER_RUNS"
          echo "  Jobs:    $FUZZER_JOBS"
          echo "  Timeout: $FUZZER_TIMEOUT seconds"
          echo "  Output:  $APFUZZ_OUT_DIR"

          python -O fuzz.py \
            -r "$FUZZER_RUNS" \
            -j "$FUZZER_JOBS" \
            -t "$FUZZER_TIMEOUT" \
            -g "$WORLD" \
            --hook worlds.tracker.fuzzer_hook:YamllessHook \
            "${META_ARGS[@]}"

      ######################################################################
      # Fuzzer summary
      ######################################################################

      - name: Fuzzer summary
        if: ${{ always() && (steps.fuzzer_preset.outputs.normal > 0 || steps.fuzzer_preset.outputs.determinism > 0 || steps.fuzzer_preset.outputs.no_restrictive_starts > 0 || steps.fuzzer_preset.outputs.check_collect_accessibility > 0 || steps.fuzzer_preset.outputs.check_gerpocalypse > 0 || steps.fuzzer_preset.outputs.check_indirect_conditions > 0 || steps.fuzzer_preset.outputs.check_item_location_count > 0 || steps.fuzzer_preset.outputs.check_lambda_capture > 0 || steps.fuzzer_preset.outputs.check_placement_item_location_refs > 0 || steps.fuzzer_preset.outputs.check_static_output_placement > 0 || steps.fuzzer_preset.outputs.ut > 0 || steps.fuzzer_preset.outputs.yamlless_ut > 0) }}
        env:
          BUILD_ROOT: ${{ steps.build_root.outputs.build_root }}
          WORLD: ${{ steps.world.outputs.world }}
          FUZZER_PRESET: ${{ inputs.fuzzer_preset }}
          FUZZER_JOBS: ${{ inputs.fuzzer_jobs }}
          FUZZER_TIMEOUT: ${{ inputs.fuzzer_timeout }}
          USE_FUZZER_META: ${{ inputs.use_fuzzer_meta }}
          DETERMINISM_RUNS: ${{ steps.fuzzer_preset.outputs.determinism }}
        run: |
          python - "$BUILD_ROOT/fuzz_output" "$WORLD" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          world = sys.argv[2]

          fuzzers = [
              ("normal", "Normal Fuzzer"),
              ("determinism", "Determinism Fuzzer"),
              ("no_restrictive_starts", "No Restrictive Starts Fuzzer"),
              ("check_collect_accessibility", "Collect Accessibility Fuzzer"),
              ("check_gerpocalypse", "GERPocalypse Fuzzer"),
              ("check_indirect_conditions", "Indirect Conditions Fuzzer"),
              ("check_item_location_count", "Item Location Count Fuzzer"),
              ("check_lambda_capture", "Lambda Capture Fuzzer"),
              ("check_placement_item_location_refs", "Placement Item/Location References Fuzzer"),
              ("check_static_output_placement", "Static Output Placement Fuzzer"),
              ("ut", "Universal Tracker Fuzzer"),
              ("yamlless_ut", "Yamlless UT Fuzzer"),
          ]

          print(f"## APWorld Fuzzer Results — `{world}`")
          print()

          print(f"**Preset:** {os.environ['FUZZER_PRESET']}")
          print(f"**Parallel workers:** {os.environ['FUZZER_JOBS']}")
          print(f"**Max time per generation:** {os.environ['FUZZER_TIMEOUT']} seconds")
          meta_status = "enabled" if os.environ['USE_FUZZER_META'] == "true" else "disabled"
          print(f"**meta.yaml:** {meta_status}")
          if int(os.environ['DETERMINISM_RUNS']) > 0:
              print("**Determinism settings:** half the configured workers (minimum 1); double the time limit")
          print()

          found_any = False

          for directory, title in fuzzers:
              report_path = root / directory / "report.json"

              if not report_path.exists():
                  continue

              found_any = True

              report = json.loads(
                  report_path.read_text(encoding="utf-8")
              )

              stats = report["stats"]
              timing = report.get("generation_time")

              print(f"### {title}")
              print()

              print("| Result | Count |")
              print("|---|---:|")
              print(f"| Success | {stats['success']} |")
              print(f"| Failures | {stats['failure']} |")
              print(f"| Timeouts | {stats['timeout']} |")
              print(f"| Ignored | {stats['ignored']} |")

              if timing:
                  print()
                  print("| Generation time | Time |")
                  print("|---|---:|")
                  print(
                      f"| Shortest | {timing['shortest']:.3f}s |"
                  )
                  print(
                      f"| Average | {timing['average']:.3f}s |"
                  )
                  print(
                      f"| Longest | {timing['longest']:.3f}s |"
                  )

              if stats["timeout"]:
                  print()
                  print(
                      f"> {stats['timeout']} generation(s) "
                      "hit the timeout limit. "
                      "Timeouts do not fail this workflow."
                  )

              if stats["failure"]:
                  print()
                  print(
                      f"> **{stats['failure']} real generation "
                      "failure(s) detected.**"
                  )

              print()

          if not found_any:
              print("No fuzzer reports were found.")
          PY

      ######################################################################
      # Upload fuzzer diagnostics
      ######################################################################

      - name: Upload fuzzer output
        if: ${{ always() && (steps.fuzzer_preset.outputs.normal > 0 || steps.fuzzer_preset.outputs.determinism > 0 || steps.fuzzer_preset.outputs.no_restrictive_starts > 0 || steps.fuzzer_preset.outputs.check_collect_accessibility > 0 || steps.fuzzer_preset.outputs.check_gerpocalypse > 0 || steps.fuzzer_preset.outputs.check_indirect_conditions > 0 || steps.fuzzer_preset.outputs.check_item_location_count > 0 || steps.fuzzer_preset.outputs.check_lambda_capture > 0 || steps.fuzzer_preset.outputs.check_placement_item_location_refs > 0 || steps.fuzzer_preset.outputs.check_static_output_placement > 0 || steps.fuzzer_preset.outputs.ut > 0 || steps.fuzzer_preset.outputs.yamlless_ut > 0) }}
        uses: actions/upload-artifact@v4
        with:
          name: apworld-fuzzer-output
          path: ${{ steps.build_root.outputs.build_root }}/fuzz_output
          if-no-files-found: ignore

      ######################################################################
      # Clean up fuzzer support
      ######################################################################

      - name: Clean up fuzzer support
        if: ${{ always() && steps.fuzzer_support.outcome == 'success' }}
        env:
          BUILD_ROOT: ${{ steps.build_root.outputs.build_root }}
          DETERMINISM_RUNS: ${{ steps.fuzzer_preset.outputs.determinism }}
          NO_RESTRICTIVE_STARTS_RUNS: ${{ steps.fuzzer_preset.outputs.no_restrictive_starts }}
          CHECK_COLLECT_ACCESSIBILITY_RUNS: ${{ steps.fuzzer_preset.outputs.check_collect_accessibility }}
          CHECK_GERPOCALYPSE_RUNS: ${{ steps.fuzzer_preset.outputs.check_gerpocalypse }}
          CHECK_INDIRECT_CONDITIONS_RUNS: ${{ steps.fuzzer_preset.outputs.check_indirect_conditions }}
          CHECK_ITEM_LOCATION_COUNT_RUNS: ${{ steps.fuzzer_preset.outputs.check_item_location_count }}
          CHECK_LAMBDA_CAPTURE_RUNS: ${{ steps.fuzzer_preset.outputs.check_lambda_capture }}
          CHECK_PLACEMENT_ITEM_LOCATION_REFS_RUNS: ${{ steps.fuzzer_preset.outputs.check_placement_item_location_refs }}
          CHECK_STATIC_OUTPUT_PLACEMENT_RUNS: ${{ steps.fuzzer_preset.outputs.check_static_output_placement }}
          UT_RUNS: ${{ steps.fuzzer_preset.outputs.ut }}
          YAMLLESS_UT_RUNS: ${{ steps.fuzzer_preset.outputs.yamlless_ut }}
          USE_FUZZER_META: ${{ inputs.use_fuzzer_meta }}
        run: |
          rm -f "$BUILD_ROOT/fuzz.py"

          if [ "$DETERMINISM_RUNS" -gt 0 ]; then
            rm -f "$BUILD_ROOT/hooks/determinism.py"
            rmdir "$BUILD_ROOT/hooks" 2>/dev/null || true
          fi

          if [ "$NO_RESTRICTIVE_STARTS_RUNS" -gt 0 ]; then
            rm -f "$BUILD_ROOT/hooks/with_empty.py"

            if [ -f "$BUILD_ROOT/worlds/empty/.apworld-release-fuzzer-fixture" ]; then
              rm -rf "$BUILD_ROOT/worlds/empty"
            fi
          fi

          if [ "$CHECK_COLLECT_ACCESSIBILITY_RUNS" -gt 0 ]; then
            rm -f "$BUILD_ROOT/hooks/collect_accessibility_test.py"
          fi

          if [ "$CHECK_GERPOCALYPSE_RUNS" -gt 0 ]; then
            rm -f "$BUILD_ROOT/hooks/gerpocalypse.py"
          fi

          if [ "$CHECK_INDIRECT_CONDITIONS_RUNS" -gt 0 ]; then
            rm -f "$BUILD_ROOT/hooks/indirect_conditions.py"
          fi

          if [ "$CHECK_ITEM_LOCATION_COUNT_RUNS" -gt 0 ]; then
            rm -f "$BUILD_ROOT/hooks/item_location_count.py"
          fi

          if [ "$CHECK_LAMBDA_CAPTURE_RUNS" -gt 0 ]; then
            rm -f "$BUILD_ROOT/hooks/detect_rule_variable_capture_issues.py"
          fi

          if [ "$CHECK_PLACEMENT_ITEM_LOCATION_REFS_RUNS" -gt 0 ]; then
            rm -f "$BUILD_ROOT/hooks/check_placement_item_location_references.py"
          fi

          if [ "$CHECK_STATIC_OUTPUT_PLACEMENT_RUNS" -gt 0 ]; then
            rm -f "$BUILD_ROOT/hooks/detect_output_placement_changes.py"
          fi

          if [ "$UT_RUNS" -gt 0 ] || [ "$YAMLLESS_UT_RUNS" -gt 0 ]; then
            rm -rf "$BUILD_ROOT/worlds/tracker"
          fi

          if [ "$USE_FUZZER_META" = "true" ]; then
            # meta.yaml lives in the source repository and was never copied
            # into BUILD_ROOT, so there is nothing to remove here.
            :
          fi

          rmdir "$BUILD_ROOT/hooks" 2>/dev/null || true

      ######################################################################
      # Unit tests
      ######################################################################

      - name: Install test dependencies
        if: ${{ inputs.run_tests }}
        env:
          BUILD_ROOT: ${{ steps.build_root.outputs.build_root }}
        working-directory: ${{ steps.build_root.outputs.build_root }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools>=75,<81"

          if [ -f ci-requirements.txt ]; then
            pip install -r ci-requirements.txt
          fi

          if [ -f WebHostLib/requirements.txt ]; then
            python ModuleUpdate.py \
              --yes \
              --force \
              --append "WebHostLib/requirements.txt"
          fi

          python -m pip install \
            --upgrade \
            --force-reinstall \
            typing_extensions==4.15.0

          python Launcher.py --update_settings

      - name: Run unit tests
        if: ${{ inputs.run_tests }}
        env:
          BUILD_ROOT: ${{ steps.build_root.outputs.build_root }}
        working-directory: ${{ steps.build_root.outputs.build_root }}
        run: |
          pytest -n auto

      ######################################################################
      # Build APWorld
      ######################################################################

      - name: Build APWorld
        env:
          BUILD_ROOT: ${{ steps.build_root.outputs.build_root }}
          GAME: ${{ steps.manifest.outputs.game }}
        working-directory: ${{ steps.build_root.outputs.build_root }}
        run: |
          echo "Building APWorld using:"
          echo "  Archipelago: $BUILD_ROOT"
          echo "  Game:        $GAME"

          python Launcher.py \
            "Build APWorlds" \
            -- \
            "$GAME"

      ######################################################################
      # Verify APWorld output
      ######################################################################

      - name: Verify APWorld exists
        env:
          BUILD_ROOT: ${{ steps.build_root.outputs.build_root }}
          WORLD: ${{ steps.world.outputs.world }}
        run: |
          APWORLD="$BUILD_ROOT/build/apworlds/${WORLD}.apworld"

          if [ ! -f "$APWORLD" ]; then
            echo "::error::Expected APWorld was not created:"
            echo "::error::$APWORLD"

            echo ""
            echo "Available APWorld files:"
            find "$BUILD_ROOT/build/apworlds" \
              -maxdepth 1 \
              -type f \
              -name '*.apworld' \
              -print \
              2>/dev/null || true

            exit 1
          fi

          ls -lh "$APWORLD"

      ######################################################################
      # Find previous release for this APWorld
      ######################################################################

      - name: Find previous release
        id: previous_release
        env:
          GH_TOKEN: ${{ github.token }}
          WORLD: ${{ steps.world.outputs.world }}
        run: |
          TAG=$(gh release list \
            --limit 200 \
            --json tagName,isDraft,isPrerelease \
            --jq "
              .[]
              | select(.isDraft == false)
              | select(.isPrerelease == false)
              | select(.tagName | startswith(\"${WORLD}-v\"))
              | .tagName
            " \
            | head -n1)

          echo "Previous release: ${TAG:-none}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Resolve previous stable release assets
        id: previous_assets
        if: inputs.include_mod
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.previous_release.outputs.tag }}
          RELEASE_SCOPE: ${{ inputs.release_scope }}
          WORLD: ${{ steps.world.outputs.world }}
          PREVIOUS_MOD_ASSET: ${{ steps.mod_settings.outputs.previous_asset }}
          PREVIOUS_MOD_VERSION: ${{ steps.mod_settings.outputs.previous_version }}
          PREVIOUS_MOD_CLIENT_VERSION: ${{ steps.mod_settings.outputs.previous_client_version }}
        run: |
          mkdir -p "$RUNNER_TEMP/previous-release-assets"

          if [ -z "$PREVIOUS_TAG" ]; then
            if [ "$RELEASE_SCOPE" != "both" ]; then
              echo "::error::One-sided releases require a previous stable release. Prereleases are intentionally not reused."
              exit 1
            fi
            echo "No stable release exists yet; both components must be built."
            exit 0
          fi

          gh release view "$PREVIOUS_TAG" --json assets > "$RUNNER_TEMP/release-assets.json"
          mapfile -t ASSETS < <(jq -r '.assets[].name' "$RUNNER_TEMP/release-assets.json")

          if printf '%s\n' "${ASSETS[@]}" | grep -Fxq "release-metadata.json"; then
            gh release download "$PREVIOUS_TAG" \
              --pattern "release-metadata.json" \
              --dir "$RUNNER_TEMP/previous-release-assets"
          fi

          PREVIOUS_APWORLD=""
          PREVIOUS_MOD=""
          PREVIOUS_MOD_VERSION_INPUT="$PREVIOUS_MOD_VERSION"
          PREVIOUS_MOD_CLIENT_VERSION_INPUT="$PREVIOUS_MOD_CLIENT_VERSION"
          PREVIOUS_MOD_VERSION=""
          PREVIOUS_MOD_COMMIT=""
          PREVIOUS_MOD_REPOSITORY=""
          PREVIOUS_MOD_REF=""
          PREVIOUS_MINECRAFT_VERSION=""
          PREVIOUS_JAVA_VERSION=""
          PREVIOUS_APWORLD_VERSION=""
          PREVIOUS_CLIENT_VERSION=""

          if [ -f "$RUNNER_TEMP/previous-release-assets/release-metadata.json" ]; then
            METADATA="$RUNNER_TEMP/previous-release-assets/release-metadata.json"
            PREVIOUS_APWORLD=$(jq -r '.apworld_asset // empty' "$METADATA")
            PREVIOUS_MOD=$(jq -r '.mod_asset // empty' "$METADATA")
            PREVIOUS_MOD_VERSION=$(jq -r '.mod_version // empty' "$METADATA")
            PREVIOUS_MOD_COMMIT=$(jq -r '.mod_source_commit // empty' "$METADATA")
            PREVIOUS_MOD_REPOSITORY=$(jq -r '.mod_source_repository // empty' "$METADATA")
            PREVIOUS_MOD_REF=$(jq -r '.mod_source_ref // empty' "$METADATA")
            PREVIOUS_MINECRAFT_VERSION=$(jq -r '.minecraft_version // empty' "$METADATA")
            PREVIOUS_JAVA_VERSION=$(jq -r '.java_version // empty' "$METADATA")
            PREVIOUS_APWORLD_VERSION=$(jq -r '.apworld_version // empty' "$METADATA")
            PREVIOUS_CLIENT_VERSION=$(jq -r '.client_version // empty' "$METADATA")
          fi

          PREVIOUS_CLIENT_VERSION="${PREVIOUS_CLIENT_VERSION:-$PREVIOUS_MOD_CLIENT_VERSION_INPUT}"

          PREVIOUS_APWORLD="${PREVIOUS_APWORLD:-${WORLD}.apworld}"
          if [ -n "$PREVIOUS_MOD_ASSET" ]; then
            PREVIOUS_MOD="$PREVIOUS_MOD_ASSET"
          fi

          if [ "$RELEASE_SCOPE" = "apworld_only" ] && [ -z "$PREVIOUS_MOD" ]; then
            mapfile -t JARS < <(printf '%s\n' "${ASSETS[@]}" | grep -E '\.jar$' || true)
            if [ "${#JARS[@]}" -eq 1 ]; then
              PREVIOUS_MOD="${JARS[0]}"
            fi
          fi

          if [ "$RELEASE_SCOPE" = "mod_only" ]; then
            if ! printf '%s\n' "${ASSETS[@]}" | grep -Fxq "$PREVIOUS_APWORLD"; then
              echo "::error::The previous stable release does not contain $PREVIOUS_APWORLD."
              exit 1
            fi
            gh release download "$PREVIOUS_TAG" \
              --pattern "$PREVIOUS_APWORLD" \
              --dir "$RUNNER_TEMP/previous-release-assets"

            python - "$RUNNER_TEMP/previous-release-assets/$PREVIOUS_APWORLD" > "$RUNNER_TEMP/previous-apworld-metadata.json" <<'PY'
          import json
          import re
          import sys
          import zipfile

          path = sys.argv[1]
          world_version = ""
          client_version = ""
          with zipfile.ZipFile(path) as archive:
              for name in archive.namelist():
                  if name.endswith("archipelago.json"):
                      try:
                          manifest = json.loads(archive.read(name))
                          world_version = str(manifest.get("world_version", ""))
                      except Exception:
                          pass
                  if name.endswith("/__init__.py") or name == "__init__.py":
                      source = archive.read(name).decode("utf-8", errors="replace")
                      match = re.search(r"(?m)^\s*client_version\s*=\s*(\d+)\b", source)
                      if match:
                          client_version = match.group(1)
                          break
          print(json.dumps({"world_version": world_version, "client_version": client_version}))
          PY
            PREVIOUS_APWORLD_VERSION=$(jq -r '.world_version // empty' "$RUNNER_TEMP/previous-apworld-metadata.json")
            PREVIOUS_CLIENT_VERSION=$(jq -r '.client_version // empty' "$RUNNER_TEMP/previous-apworld-metadata.json")
            if [ -z "$PREVIOUS_APWORLD_VERSION" ] || [ -z "$PREVIOUS_CLIENT_VERSION" ]; then
              echo "::error::Could not read world_version and client_version from the previous APWorld package."
              exit 1
            fi
          fi

          if [ "$RELEASE_SCOPE" = "apworld_only" ]; then
            if [ -z "$PREVIOUS_MOD" ]; then
              echo "::error::Could not identify the previous mod asset. Add release-metadata.json to a prior release or set previous_mod_asset."
              exit 1
            fi
            if ! printf '%s\n' "${ASSETS[@]}" | grep -Fxq "$PREVIOUS_MOD"; then
              echo "::error::The previous stable release does not contain mod asset $PREVIOUS_MOD."
              exit 1
            fi
            gh release download "$PREVIOUS_TAG" \
              --pattern "$PREVIOUS_MOD" \
              --dir "$RUNNER_TEMP/previous-release-assets"
            if [ -z "$PREVIOUS_MOD_VERSION" ]; then
              PREVIOUS_MOD_VERSION="$PREVIOUS_MOD_VERSION_INPUT"
            fi
            if [ -z "$PREVIOUS_MOD_VERSION" ] && [[ "$PREVIOUS_MOD" =~ ^aprandomizer-(.+)\.jar$ ]]; then
              PREVIOUS_MOD_VERSION="${BASH_REMATCH[1]}"
            fi
          fi

          {
            echo "apworld_asset=$PREVIOUS_APWORLD"
            echo "apworld_version=$PREVIOUS_APWORLD_VERSION"
            echo "client_version=$PREVIOUS_CLIENT_VERSION"
            echo "mod_asset=$PREVIOUS_MOD"
            echo "mod_version=$PREVIOUS_MOD_VERSION"
            echo "mod_commit=$PREVIOUS_MOD_COMMIT"
            echo "mod_repository=$PREVIOUS_MOD_REPOSITORY"
            echo "mod_ref=$PREVIOUS_MOD_REF"
            echo "minecraft_version=$PREVIOUS_MINECRAFT_VERSION"
            echo "java_version=$PREVIOUS_JAVA_VERSION"
            echo "apworld_path=$RUNNER_TEMP/previous-release-assets/$PREVIOUS_APWORLD"
            echo "mod_path=$RUNNER_TEMP/previous-release-assets/$PREVIOUS_MOD"
          } >> "$GITHUB_OUTPUT"

          echo "Previous stable APWorld asset: $PREVIOUS_APWORLD"
          echo "Previous stable mod asset: ${PREVIOUS_MOD:-not selected}"

      ######################################################################
      # Optional companion mod build
      #
      # Example: put a mod project on a companion branch, select that branch
      # as mod_source_ref, and point mod_project_path at its Gradle project.
      # The project should expose a Gradle wrapper and build/libs/*.jar.
      ######################################################################

      - name: Checkout companion mod source
        if: inputs.include_mod && inputs.release_scope != 'apworld_only'
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.mod_settings.outputs.source_repository }}
          ref: ${{ steps.mod_settings.outputs.source_ref }}
          path: mod-source
          fetch-depth: 0
          persist-credentials: true

      - name: Set up mod Java
        if: inputs.include_mod && inputs.release_scope != 'apworld_only'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.mod_settings.outputs.java_version }}

      - name: Build companion mod
        id: mod_build
        if: inputs.include_mod && inputs.release_scope != 'apworld_only'
        env:
          MOD_PROJECT_PATH: ${{ steps.mod_settings.outputs.project_path }}
          MOD_VERSION_OVERRIDE: ${{ steps.mod_settings.outputs.version }}
          MOD_ASSET_NAME: ${{ steps.mod_settings.outputs.asset_name }}
          MOD_ARTIFACT_PATH: ${{ steps.mod_settings.outputs.artifact_path }}
          MOD_PROTOCOL_FILE: ${{ steps.mod_settings.outputs.protocol_file }}
          WORLD_SOURCE_DIR: ${{ steps.world.outputs.source_dir }}
          WORLD_VERSION: ${{ inputs.include_mod && inputs.release_scope == 'mod_only' && steps.previous_assets.outputs.apworld_version || steps.manifest.outputs.world_version }}
          MOD_JAVA_VERSION: ${{ steps.mod_settings.outputs.java_version }}
          RELEASE_SCOPE: ${{ inputs.release_scope }}
          PREVIOUS_CLIENT_VERSION: ${{ steps.previous_assets.outputs.client_version }}
        run: |
          python <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          source_root = (workspace / "mod-source").resolve()
          project = (source_root / os.environ["MOD_PROJECT_PATH"]).resolve()

          if source_root not in project.parents and project != source_root:
              raise SystemExit("mod_project_path must stay inside the checked-out mod source.")
          if not project.is_dir():
              raise SystemExit(f"Mod project directory does not exist: {project}")

          properties_path = project / "gradle.properties"
          if not properties_path.is_file():
              raise SystemExit(f"Expected Gradle project properties: {properties_path}")

          properties = properties_path.read_text(encoding="utf-8")
          match = re.search(r"(?m)^\s*mod_version\s*=\s*(\S+)\s*$", properties)
          if not match:
              raise SystemExit("gradle.properties must define mod_version=... .")

          mod_version = os.environ["MOD_VERSION_OVERRIDE"].strip() or match.group(1)
          semver = re.compile(
              r"^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"
              r"(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?"
              r"(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$"
          )
          version_match = semver.fullmatch(mod_version)
          if not version_match:
              raise SystemExit(
                  f"Mod version {mod_version!r} is not a valid SemVer version."
              )
          prerelease = version_match.group(4)
          if prerelease and any(
              part.isdigit() and len(part) > 1 and part.startswith("0")
              for part in prerelease.split(".")
          ):
              raise SystemExit("Numeric SemVer prerelease identifiers cannot have leading zeroes.")

          world_match = re.fullmatch(r"(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", os.environ["WORLD_VERSION"])
          if not world_match:
              raise SystemExit("The APWorld manifest world_version must be major.minor.patch.")
          if version_match.group(1, 2) != world_match.group(1, 2):
              raise SystemExit(
                  "APWorld and mod major/minor versions must match for the shared "
                  f"compatibility line (APWorld {os.environ['WORLD_VERSION']}, mod {mod_version})."
              )

          if os.environ["MOD_VERSION_OVERRIDE"].strip():
              properties = re.sub(
                  r"(?m)^\s*mod_version\s*=\s*\S+\s*$",
                  f"mod_version={mod_version}",
                  properties,
                  count=1,
              )
              properties_path.write_text(properties, encoding="utf-8")

          if os.environ["MOD_PROTOCOL_FILE"].strip():
              protocol_path = (project / os.environ["MOD_PROTOCOL_FILE"]).resolve()
              if project not in protocol_path.parents:
                  raise SystemExit("mod_protocol_file must stay inside the mod project.")
              protocol_text = protocol_path.read_text(encoding="utf-8")
              versions_match = re.search(
                  r"VALID_VERSIONS\s*=\s*IntSet\.of\s*\((.*?)\)",
                  protocol_text,
                  re.DOTALL,
              )
              ap_source = (workspace / os.environ["WORLD_SOURCE_DIR"] / "__init__.py").resolve()
              ap_text = ap_source.read_text(encoding="utf-8")
              client_match = re.search(r"(?m)^\s*client_version\s*=\s*(\d+)\b", ap_text)
              if not versions_match:
                  raise SystemExit("Could not compare the APWorld client_version with the mod VALID_VERSIONS.")
              supported = {int(value) for value in re.findall(r"\b\d+\b", versions_match.group(1))}
              if os.environ["RELEASE_SCOPE"] == "mod_only":
                  expected_client_version = os.environ["PREVIOUS_CLIENT_VERSION"].strip()
              else:
                  expected_client_version = client_match.group(1) if client_match else ""
              if not expected_client_version:
                  raise SystemExit("Could not resolve the APMC protocol version to validate for the mod.")
              client_version = int(expected_client_version)
              if client_version not in supported:
                  raise SystemExit(
                      f"APWorld client_version {client_version} is not supported by the mod "
                      f"(VALID_VERSIONS: {sorted(supported)})."
                  )
          else:
              client_version = ""

          build = subprocess.run(
              ["bash", "./gradlew", "build", "--no-daemon"],
              cwd=project,
              check=False,
          )
          if build.returncode:
              raise SystemExit(build.returncode)

          artifact_setting = os.environ["MOD_ARTIFACT_PATH"].strip()
          if artifact_setting:
              artifact = (project / artifact_setting).resolve()
              if project not in artifact.parents:
                  raise SystemExit("mod_artifact_path must stay inside the mod project.")
          else:
              candidates = [
                  path for path in (project / "build" / "libs").glob("*.jar")
                  if not path.name.endswith(("-sources.jar", "-javadoc.jar"))
              ]
              if len(candidates) != 1:
                  raise SystemExit(
                      "Expected exactly one main JAR under build/libs; set mod_artifact_path "
                      f"to select one (found {len(candidates)})."
                  )
              artifact = candidates[0]

          if not artifact.is_file():
              raise SystemExit(f"Mod build artifact is missing: {artifact}")

          asset_name = os.environ["MOD_ASSET_NAME"].strip() or artifact.name
          if Path(asset_name).name != asset_name or "\n" in asset_name or "\r" in asset_name:
              raise SystemExit("mod_asset_name must be a plain filename without directories.")

          outputs = {
              "version": mod_version,
              "artifact": str(artifact),
              "asset_name": asset_name,
              "project": str(project),
              "source_commit": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], cwd=source_root, text=True
              ).strip(),
              "minecraft": re.search(r"(?m)^\s*minecraft_version\s*=\s*(\S+)", properties).group(1),
              "java": os.environ["MOD_JAVA_VERSION"],
              "client_version": str(client_version),
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
              for key, value in outputs.items():
                  output_file.write(f"{key}={value}\n")

          print("Mod build settings:")
          for key, value in outputs.items():
              print(f"  {key}: {value}")
          PY

      - name: Resolve release identity
        id: release_identity
        env:
          WORLD: ${{ steps.world.outputs.world }}
          GAME: ${{ steps.manifest.outputs.game }}
          WORLD_VERSION: ${{ inputs.include_mod && inputs.release_scope == 'mod_only' && steps.previous_assets.outputs.apworld_version || steps.manifest.outputs.world_version }}
          WORLD_SOURCE_DIR: ${{ steps.world.outputs.source_dir }}
          INCLUDE_MOD: ${{ inputs.include_mod }}
          RELEASE_SCOPE: ${{ inputs.release_scope }}
          MOD_VERSION: ${{ steps.mod_build.outputs.version || steps.previous_assets.outputs.mod_version }}
          MOD_CLIENT_VERSION: ${{ steps.mod_build.outputs.client_version }}
          PREVIOUS_CLIENT_VERSION: ${{ steps.previous_assets.outputs.client_version }}
          RELEASE_TITLE_OVERRIDE: ${{ steps.mod_settings.outputs.release_title }}
        run: |
          if [ "$INCLUDE_MOD" = "true" ] && [ "$RELEASE_SCOPE" = "mod_only" ]; then
            AP_CLIENT_VERSION="$PREVIOUS_CLIENT_VERSION"
          else
            AP_CLIENT_VERSION=$(python - "$WORLD_SOURCE_DIR/__init__.py" <<'PY'
          import re
          import sys
          from pathlib import Path
          match = re.search(r"(?m)^\s*client_version\s*=\s*(\d+)\b", Path(sys.argv[1]).read_text(encoding="utf-8"))
          if not match:
              raise SystemExit("Could not read client_version from the APWorld source.")
          print(match.group(1))
          PY
            )
          fi

          if [ "$INCLUDE_MOD" = "true" ]; then
            if [ -z "$MOD_VERSION" ]; then
              echo "::error::A mod version is missing; select a mode that builds the mod or add metadata to the previous release."
              exit 1
            fi
            WORLD_LINE="${WORLD_VERSION%.*}"
            MOD_CORE="${MOD_VERSION%%+*}"
            MOD_CORE="${MOD_CORE%%-*}"
            MOD_LINE="${MOD_CORE%.*}"
            if [ "$WORLD_LINE" != "$MOD_LINE" ]; then
              echo "::error::APWorld and mod major/minor versions must match (APWorld $WORLD_VERSION, mod $MOD_VERSION)."
              exit 1
            fi

            if [ "$RELEASE_SCOPE" = "mod_only" ]; then
              if [ -z "$PREVIOUS_CLIENT_VERSION" ] || [ "$MOD_CLIENT_VERSION" != "$PREVIOUS_CLIENT_VERSION" ]; then
                echo "::error::The mod protocol version must match the reused stable APWorld (mod $MOD_CLIENT_VERSION, APWorld $PREVIOUS_CLIENT_VERSION)."
                exit 1
              fi
            elif [ "$RELEASE_SCOPE" = "apworld_only" ]; then
              if [ -z "$PREVIOUS_CLIENT_VERSION" ] || [ "$AP_CLIENT_VERSION" != "$PREVIOUS_CLIENT_VERSION" ]; then
                echo "::error::The APWorld client_version must match the reused stable mod. Set previous_mod_client_version if the prior release lacks metadata."
                exit 1
              fi
            elif [ -n "$MOD_CLIENT_VERSION" ] && [ "$MOD_CLIENT_VERSION" != "$AP_CLIENT_VERSION" ]; then
              echo "::error::APWorld client_version and mod protocol version differ ($AP_CLIENT_VERSION vs $MOD_CLIENT_VERSION)."
              exit 1
            elif [ -z "$MOD_CLIENT_VERSION" ]; then
              echo "::warning::The mod protocol compatibility check is disabled; future one-sided releases will need previous_client_version in the mod config."
            fi
            TAG="${WORLD}-v${WORLD_VERSION}-mod-v${MOD_VERSION}"
            DEFAULT_TITLE="${GAME} APWorld v${WORLD_VERSION} + mod v${MOD_VERSION}"
          else
            TAG="${WORLD}-v${WORLD_VERSION}"
            DEFAULT_TITLE="${GAME} APWorld release v${WORLD_VERSION}"
          fi

          TITLE="${RELEASE_TITLE_OVERRIDE:-$DEFAULT_TITLE}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "world_version=$WORLD_VERSION" >> "$GITHUB_OUTPUT"
          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"
          echo "client_version=$AP_CLIENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"
          echo "Release title: $TITLE"

      ######################################################################
      # Generate release notes
      ######################################################################

      - name: Generate release notes
        env:
          WORLD: ${{ steps.world.outputs.world }}
          GAME: ${{ steps.manifest.outputs.game }}
          VERSION: ${{ steps.release_identity.outputs.world_version }}
          INCLUDE_CHANGELOG: ${{ inputs.include_changelog }}
          NOTES_FILE: ${{ inputs.release_notes_file }}
          PREVIOUS_TAG: ${{ steps.previous_release.outputs.tag }}
          RELEASE_TAG: ${{ steps.release_identity.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SOURCE_DIR: ${{ steps.world.outputs.source_dir }}
          INCLUDE_MOD: ${{ inputs.include_mod }}
          RELEASE_SCOPE: ${{ inputs.release_scope }}
          MOD_VERSION: ${{ steps.mod_build.outputs.version || steps.previous_assets.outputs.mod_version }}
          MOD_ASSET_NAME: ${{ steps.mod_build.outputs.asset_name || steps.previous_assets.outputs.mod_asset }}
          RELEASE_TITLE: ${{ steps.release_identity.outputs.title }}
          MOD_PROJECT: ${{ steps.mod_build.outputs.project }}
          MOD_SOURCE_COMMIT: ${{ steps.mod_build.outputs.source_commit }}
          PREVIOUS_MOD_COMMIT: ${{ steps.previous_assets.outputs.mod_commit }}
          MOD_CHANGELOG_FILE: ${{ steps.mod_settings.outputs.changelog_file }}
        run: |
          python <<'PY'
          import os
          import subprocess
          from pathlib import Path
          from urllib.parse import quote

          world = os.environ["WORLD"]
          version = os.environ["VERSION"]
          previous = os.environ["PREVIOUS_TAG"]
          repository = os.environ["REPOSITORY"]
          branch = os.environ["BRANCH"]
          source_dir = os.environ["SOURCE_DIR"]
          release_tag = os.environ["RELEASE_TAG"]

          print(f"APWorld:       {world}")
          print(f"Source dir:    {source_dir}")
          print(f"Branch:        {branch}")
          print(f"Previous tag:  {previous or 'none'}")

          # --------------------------------------------------------------
          # GitHub source/documentation URLs
          # --------------------------------------------------------------

          source_path = Path(source_dir)

          if source_dir == ".":
              source_url_path = ""
          else:
              source_url_path = "/".join(
                  quote(part)
                  for part in source_path.parts
              )

          if source_url_path:
              docs_url = (
                  f"https://github.com/{repository}/tree/"
                  f"{quote(branch)}/{source_url_path}/docs"
              )
          else:
              docs_url = (
                  f"https://github.com/{repository}/tree/"
                  f"{quote(branch)}/docs"
              )

          docs_markdown = f"[game-specific documentation]({docs_url})"

          compare_url = ""

          if previous:
              compare_url = (
                  f"https://github.com/{repository}/compare/"
                  f"{quote(previous, safe='')}..."
                  f"{quote(release_tag, safe='')}"
              )

          # --------------------------------------------------------------
          # Load custom template
          # --------------------------------------------------------------

          notes_file = os.environ["NOTES_FILE"]
          template = None

          if notes_file:
              path = Path(notes_file)

              if path.exists():
                  template = path.read_text(
                      encoding="utf-8"
                  )

          variables = {
              "{VERSION}": version,
              "{GAME}": os.environ["GAME"],
              "{WORLD}": world,
              "{REPOSITORY}": repository,
              "{BRANCH}": branch,
              "{SOURCE_DIR}": source_dir,
              "{DOCS_URL}": docs_url,
              "{COMPARE_URL}": compare_url,
              "{MOD_VERSION}": os.environ.get("MOD_VERSION", ""),
              "{MOD_ASSET}": os.environ.get("MOD_ASSET_NAME", ""),
              "{RELEASE_TAG}": release_tag,
              "{RELEASE_TITLE}": os.environ.get("RELEASE_TITLE", ""),
          }

          if template:
              notes = template

              for key, value in variables.items():
                  notes = notes.replace(key, value)

          else:
              notes = f"""## Installation & Setup

          - Requires [Archipelago](https://github.com/ArchipelagoMW/Archipelago/releases/latest). Make sure you are up-to-date.
          - Download the `.apworld` file below and double-click it to install. Restart Archipelago after installation.
          - Use **Options Creator** or **Generate Template Options** in the Archipelago Launcher to create player option YAML files.
          - Place your edited player option YAML files in the `Players` folder. Use **Browse Files...** in the Launcher to open the Archipelago directory.
          - Make sure you have all required `.apworld` files, your player YAMLs, and any desired `host.yaml` settings ready before generating. (`server_password` is recommended for admin login.)
          - Click **Generate** to create a multiworld `.zip` in the `output` folder.
          - Upload the generated `.zip` to https://archipelago.gg/uploads or self-host it. Self-hosting requires port forwarding.
          - For detailed setup instructions and game-specific documentation, see {docs_markdown}.
          - If you encounter errors, run `ArchipelagoLauncherDebug.exe` or launch Archipelago from a terminal and check the `logs` folder.
          - Need help? Join the Archipelago Discord: https://discord.gg/8Z65BR2

          """

          # --------------------------------------------------------------
          # Changelog
          # --------------------------------------------------------------

          if (
              os.environ["INCLUDE_CHANGELOG"] == "true"
              and os.environ["RELEASE_SCOPE"] != "mod_only"
          ):
              notes += "\n\n## Changelog\n\n"

              command = [
                  "git",
                  "log",
                  "--no-merges",
                  "--pretty=- %s (%h)",
              ]

              if previous:
                  command.insert(
                      2,
                      f"{previous}..HEAD",
                  )

              if source_dir != ".":
                  command.extend([
                      "--",
                      source_dir,
                  ])

              else:
                  command.extend([
                      "--",
                      ".",
                      ":(exclude).git/",
                      ":(exclude).github/",
                      ":(exclude).idea/",
                      ":(exclude).archipelago-build/",
                      ":(exclude)build/",
                      ":(exclude)release_files/",
                      ":(exclude)release_notes.md",
                      ":(exclude).gitignore",
                  ])

              result = subprocess.run(
                  command,
                  capture_output=True,
                  text=True,
                  check=False,
              )

              if result.returncode != 0:
                  print(
                      "Warning: git log failed while generating "
                      "the changelog:"
                  )
                  print(result.stderr)

              changelog = result.stdout.strip()

              if changelog:
                  notes += changelog
              else:
                  notes += "- No changes since previous release."

              if compare_url:
                  notes += (
                      "\n\n"
                      "Full comparison:\n"
                      f"{compare_url}"
                  )

          if os.environ["INCLUDE_MOD"] == "true":
              notes += "\n\n## Companion mod\n\n"
              notes += f"- Version: `{os.environ['MOD_VERSION']}`\n"
              notes += f"- Asset: `{os.environ['MOD_ASSET_NAME']}`\n"

              if os.environ["RELEASE_SCOPE"] == "apworld_only":
                  notes += "- This release reuses the mod artifact from the latest stable release.\n"
              else:
                  notes += "- The mod was built from the selected source branch for this release.\n"
                  mod_changelog_file = os.environ["MOD_CHANGELOG_FILE"]
                  mod_project = Path(os.environ["MOD_PROJECT"])
                  changelog_path = mod_project / mod_changelog_file if mod_changelog_file else None

                  if changelog_path and changelog_path.is_file():
                      mod_changelog = changelog_path.read_text(encoding="utf-8").strip()
                  else:
                      previous_mod_commit = os.environ["PREVIOUS_MOD_COMMIT"]
                      command = [
                          "git", "-C", str(mod_project), "log", "-10",
                          "--no-merges", "--pretty=- %s (%h)",
                      ]
                      if previous_mod_commit:
                          ancestor = subprocess.run(
                              ["git", "-C", str(mod_project), "merge-base", "--is-ancestor",
                               previous_mod_commit, "HEAD"],
                              check=False,
                          )
                          if ancestor.returncode == 0:
                              command.insert(4, f"{previous_mod_commit}..HEAD")
                      result = subprocess.run(
                          command, capture_output=True, text=True, check=False
                      )
                      mod_changelog = result.stdout.strip() if result.returncode == 0 else ""

                  notes += "\n### Mod changes\n\n"
                  notes += mod_changelog or "- No mod source changes were found."

                  if os.environ["MOD_SOURCE_COMMIT"]:
                      notes += (
                          "\n\nSource commit: `"
                          + os.environ["MOD_SOURCE_COMMIT"][:12]
                          + "`"
                      )

          Path("release_notes.md").write_text(
              notes,
              encoding="utf-8",
          )
          PY

      ######################################################################
      # Prepare release files
      ######################################################################

      - name: Prepare release files
        env:
          BUILD_ROOT: ${{ steps.build_root.outputs.build_root }}
          INCLUDE_PLAYER_YAML: ${{ inputs.include_player_yaml }}
          WORLD: ${{ steps.world.outputs.world }}
          INCLUDE_MOD: ${{ inputs.include_mod }}
          RELEASE_SCOPE: ${{ inputs.release_scope }}
          PREVIOUS_APWORLD_PATH: ${{ steps.previous_assets.outputs.apworld_path }}
          PREVIOUS_MOD_PATH: ${{ steps.previous_assets.outputs.mod_path }}
          PREVIOUS_MOD_ASSET: ${{ steps.previous_assets.outputs.mod_asset }}
          BUILT_MOD_PATH: ${{ steps.mod_build.outputs.artifact }}
          BUILT_MOD_ASSET: ${{ steps.mod_build.outputs.asset_name }}
          APWORLD_VERSION: ${{ steps.release_identity.outputs.world_version }}
          MOD_VERSION: ${{ steps.mod_build.outputs.version || steps.previous_assets.outputs.mod_version }}
          CLIENT_VERSION: ${{ steps.release_identity.outputs.client_version }}
          MOD_SOURCE_COMMIT: ${{ steps.mod_build.outputs.source_commit || steps.previous_assets.outputs.mod_commit }}
          MOD_SOURCE_REPOSITORY: ${{ steps.mod_build.outputs.source_repository || steps.previous_assets.outputs.mod_repository || steps.mod_settings.outputs.source_repository }}
          MOD_SOURCE_REF: ${{ steps.mod_build.outputs.source_ref || steps.previous_assets.outputs.mod_ref || steps.mod_settings.outputs.source_ref }}
          MOD_MINECRAFT_VERSION: ${{ steps.mod_build.outputs.minecraft || steps.previous_assets.outputs.minecraft_version }}
          MOD_JAVA_VERSION: ${{ steps.mod_build.outputs.java || steps.previous_assets.outputs.java_version }}
        run: |
          mkdir -p release_files

          if [ "$INCLUDE_MOD" = "true" ] && [ "$RELEASE_SCOPE" = "mod_only" ]; then
            cp "$PREVIOUS_APWORLD_PATH" "release_files/${WORLD}.apworld"
          else
            cp \
              "$BUILD_ROOT/build/apworlds/${WORLD}.apworld" \
              "release_files/${WORLD}.apworld"
          fi

          if [ "$INCLUDE_PLAYER_YAML" = "true" ] && \
             ! { [ "$INCLUDE_MOD" = "true" ] && [ "$RELEASE_SCOPE" = "mod_only" ]; }; then
            if [ ! -f "${WORLD}.yaml" ]; then
              echo "::error::Expected generated player YAML: ${WORLD}.yaml"
              exit 1
            fi

            cp \
              "${WORLD}.yaml" \
              "release_files/${WORLD}.yaml"
          fi

          if [ "$INCLUDE_MOD" = "true" ]; then
            if [ "$RELEASE_SCOPE" = "apworld_only" ]; then
              MOD_ASSET="$PREVIOUS_MOD_ASSET"
              cp "$PREVIOUS_MOD_PATH" "release_files/$MOD_ASSET"
            else
              MOD_ASSET="$BUILT_MOD_ASSET"
              cp "$BUILT_MOD_PATH" "release_files/$MOD_ASSET"
            fi
            export MOD_ASSET

            python <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = {
              "schema_version": 1,
              "apworld_asset": f"{os.environ['WORLD']}.apworld",
              "apworld_version": os.environ["APWORLD_VERSION"],
              "mod_asset": os.environ["MOD_ASSET"],
              "mod_version": os.environ["MOD_VERSION"],
              "client_version": int(os.environ["CLIENT_VERSION"]),
              "mod_source_repository": os.environ["MOD_SOURCE_REPOSITORY"],
              "mod_source_ref": os.environ["MOD_SOURCE_REF"],
              "mod_source_commit": os.environ["MOD_SOURCE_COMMIT"],
              "minecraft_version": os.environ["MOD_MINECRAFT_VERSION"],
              "java_version": os.environ["MOD_JAVA_VERSION"],
          }
          Path("release_files/release-metadata.json").write_text(
              json.dumps(metadata, indent=2) + "\n", encoding="utf-8"
          )
          PY
          fi

          echo "Release files:"
          ls -lh release_files

      - name: Validate release artifacts
        env:
          BUILD_ROOT: ${{ steps.build_root.outputs.build_root }}
          WORLD: ${{ steps.world.outputs.world }}
          INCLUDE_PLAYER_YAML: ${{ inputs.include_player_yaml }}
          INCLUDE_MOD: ${{ inputs.include_mod }}
          RELEASE_SCOPE: ${{ inputs.release_scope }}
        run: |
          if [ "$INCLUDE_MOD" = "true" ] && [ "$RELEASE_SCOPE" = "mod_only" ]; then
            if [ ! -f "release_files/${WORLD}.apworld" ]; then
              echo "::error::Missing reused APWorld: release_files/${WORLD}.apworld"
              exit 1
            fi
          else
            APWORLD="$BUILD_ROOT/build/apworlds/${WORLD}.apworld"
            if [ ! -f "$APWORLD" ]; then
              echo "::error::Missing APWorld: $APWORLD"
              exit 1
            fi
          fi

          if [ "$INCLUDE_PLAYER_YAML" = "true" ] && \
             ! { [ "$INCLUDE_MOD" = "true" ] && [ "$RELEASE_SCOPE" = "mod_only" ]; } && \
             [ ! -f "${WORLD}.yaml" ]; then
            echo "::error::Missing player YAML: ${WORLD}.yaml"
            exit 1
          fi

          if [ "$INCLUDE_MOD" = "true" ]; then
            if [ ! -f release_files/release-metadata.json ]; then
              echo "::error::Missing release metadata for paired assets."
              exit 1
            fi
            MOD_ASSET=$(jq -r '.mod_asset' release_files/release-metadata.json)
            if [ ! -f "release_files/$MOD_ASSET" ]; then
              echo "::error::Missing companion mod asset: release_files/$MOD_ASSET"
              exit 1
            fi
          fi

          if [ ! -f release_notes.md ]; then
            echo "::error::Missing release notes: release_notes.md"
            exit 1
          fi
      
          echo "All release artifacts are ready."

      - name: Check release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_identity.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Release tag already exists: $TAG"
            echo "::error::A previous release attempt may have left the tag behind."
            exit 1
          fi
      
          echo "Release tag is available: $TAG"

      ######################################################################
      # Commit manifest update
      ######################################################################

      - name: Commit manifest
        env:
          MANIFEST_PATH: ${{ steps.manifest.outputs.manifest_path }}
          WORLD: ${{ steps.world.outputs.world }}
          VERSION: ${{ steps.release_identity.outputs.world_version }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add "$MANIFEST_PATH"

          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git commit \
            -m "Release ${WORLD} v${VERSION}"

      ######################################################################
      # Push release commit
      ######################################################################

      - name: Push release commit
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git push origin "HEAD:$BRANCH"

      ######################################################################
      # Create release tag
      ######################################################################

      - name: Create release tag
        id: tag
        env:
          TAG: ${{ steps.release_identity.outputs.tag }}
        run: |
          echo "Creating tag: $TAG"

          git tag "$TAG"
          git push origin "$TAG"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      ######################################################################
      # Create GitHub Release
      ######################################################################

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.release_identity.outputs.title }}
          body_path: release_notes.md
          prerelease: ${{ inputs.prerelease }}
          files: |
            release_files/*

      - name: Update companion mod version catalog
        if: inputs.include_mod && inputs.release_scope != 'apworld_only'
        env:
          MOD_SOURCE_REPOSITORY: ${{ steps.mod_settings.outputs.source_repository }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          MOD_SOURCE_REF: ${{ steps.mod_settings.outputs.source_ref }}
          MOD_PROJECT_PATH: ${{ steps.mod_settings.outputs.project_path }}
          VERSION_CATALOG: ${{ steps.mod_settings.outputs.version_catalog }}
          MOD_VERSION: ${{ steps.mod_build.outputs.version }}
          CLIENT_VERSION: ${{ steps.mod_build.outputs.client_version }}
          MINECRAFT_VERSION: ${{ steps.mod_build.outputs.minecraft }}
          JAVA_VERSION: ${{ steps.mod_build.outputs.java }}
          MOD_ASSET: ${{ steps.mod_build.outputs.asset_name }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "$MOD_SOURCE_REPOSITORY" != "$CURRENT_REPOSITORY" ]; then
            echo "::notice::The mod source is in $MOD_SOURCE_REPOSITORY, so its catalog was not pushed. Configure a token and a cross-repository catalog update if needed."
            exit 0
          fi

          if [ -z "$VERSION_CATALOG" ]; then
            echo "Version catalog update is disabled in .github/apworld-release-mod.json."
            exit 0
          fi

          if ! git check-ref-format --branch "$MOD_SOURCE_REF" >/dev/null; then
            echo "::error::A version catalog can only be pushed to a mod source branch, not a tag or raw commit."
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          source_root = (workspace / "mod-source").resolve()
          project = (source_root / os.environ["MOD_PROJECT_PATH"]).resolve()
          catalog = (project / os.environ["VERSION_CATALOG"]).resolve()
          if project not in catalog.parents:
              raise SystemExit("version_catalog must stay inside the configured mod project.")
          if not catalog.is_file():
              raise SystemExit(f"Configured version catalog not found: {catalog}")

          entries = json.loads(catalog.read_text(encoding="utf-8"))
          if not isinstance(entries, list):
              raise SystemExit("The mod version catalog must contain a JSON array.")

          channel = "beta" if os.environ["PRERELEASE"] == "true" else "release"
          asset = os.environ["MOD_ASSET"]
          tag = os.environ["RELEASE_TAG"]
          repository = os.environ["RELEASE_REPOSITORY"]
          url = (
              f"https://github.com/{repository}/releases/download/"
              f"{quote(tag, safe='')}/{quote(asset, safe='')}"
          )
          entry = {
              "version": os.environ["MOD_VERSION"],
              "channel": channel,
              "data": int(os.environ["CLIENT_VERSION"]),
              "java": int(os.environ["JAVA_VERSION"]),
              "minecraft": os.environ["MINECRAFT_VERSION"],
              "url": url,
          }

          entries = [
              old for old in entries
              if not (
                  old.get("channel") == channel
                  and old.get("data") == entry["data"]
                  and old.get("version") == entry["version"]
              )
          ]
          entries.insert(0, entry)
          catalog.write_text(json.dumps(entries, indent=2) + "\n", encoding="utf-8")
          print(f"Updated catalog entry: {entry}")
          PY

          MOD_SOURCE_PATH="mod-source/$MOD_PROJECT_PATH"
          git -C "$MOD_SOURCE_PATH" config user.name "github-actions[bot]"
          git -C "$MOD_SOURCE_PATH" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$MOD_SOURCE_PATH" add -- "$VERSION_CATALOG"

          if git -C "$MOD_SOURCE_PATH" diff --cached --quiet; then
            echo "Version catalog already contains this release."
            exit 0
          fi

          git -C "$MOD_SOURCE_PATH" commit -m "Update Minecraft mod version catalog"
          git -C mod-source push origin "HEAD:refs/heads/$MOD_SOURCE_REF"

      - name: Release summary
        if: success()
        env:
          RELEASE_TITLE: ${{ steps.release_identity.outputs.title }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.tag }}
          WORLD: ${{ steps.world.outputs.world }}
          WORLD_VERSION: ${{ steps.release_identity.outputs.world_version }}
          INCLUDE_MOD: ${{ inputs.include_mod }}
          RELEASE_SCOPE: ${{ inputs.release_scope }}
          MOD_VERSION: ${{ steps.release_identity.outputs.mod_version }}
          CLIENT_VERSION: ${{ steps.release_identity.outputs.client_version }}
          MOD_SOURCE_REF: ${{ steps.mod_settings.outputs.source_ref }}
        run: |
          {
            echo "## Release created"
            echo
            echo "- **Title:** $RELEASE_TITLE"
            echo "- **Release:** [$RELEASE_TAG]($RELEASE_URL)"
            echo "- **APWorld:** $WORLD v$WORLD_VERSION"
            if [ "$INCLUDE_MOD" = "true" ]; then
              echo "- **Mod:** v$MOD_VERSION (APMC $CLIENT_VERSION)"
              echo "- **Update scope:** $RELEASE_SCOPE"
              echo "- **Mod source:** $MOD_SOURCE_REF"
            fi
            echo "- **Assets:**"
            for asset in release_files/*; do
              [ -f "$asset" ] && echo "  - \`$(basename "$asset")\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      ######################################################################
      # Failure diagnostics
      ######################################################################

      - name: Failure diagnostics
        if: failure()
        env:
          BUILD_ROOT: ${{ steps.build_root.outputs.build_root }}
          WORLD: ${{ steps.world.outputs.world }}
        run: |
          echo "Workflow failed."

          echo ""
          echo "Source repository status:"
          git status --short

          if [ -d "$BUILD_ROOT" ]; then
            echo ""
            echo "Build environment:"
            echo "  $BUILD_ROOT"

            echo ""
            echo "APWorld directory:"
            find "$BUILD_ROOT/worlds/$WORLD" \
              -maxdepth 3 \
              -type f \
              2>/dev/null \
              | sort || true

            echo ""
            echo "Build output:"
            find "$BUILD_ROOT/build/apworlds" \
              -maxdepth 1 \
              -type f \
              2>/dev/null \
              | sort || true
          fi
