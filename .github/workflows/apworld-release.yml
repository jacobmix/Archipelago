# TODO:
# COMMENTS. Mainly how to use custom release notes file, and game name override being needed if no manifest exisists.
# DEFAULTS. See if theres a way to customize defaults else just recommend people make copies of the workflow with their own defaults for each branch.
# TESTS. Maybe do some tests before making the release.
# EXPERIMENT. Need to use is different ways, ask people for input, and ideas. Need to work for most (sane) cases, and be simply, easy to use. But with enough malleability.

name: APWorld Release

on:
  workflow_dispatch:
    inputs:
      world:
        description: "World folder (example: apquest)"
        required: true
        default: "apquest"

      bump:
        description: "Version bump"
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - none

      world_version:
        description: "Override world_version (blank = use bump)"
        required: false
        default: ""

      game:
        description: "Override game (blank = keep existing)"
        required: false
        default: ""

      minimum_ap_version:
        description: "Override minimum_ap_version (blank = keep existing)"
        required: false
        default: ""

      maximum_ap_version:
        description: "Override maximum_ap_version (blank = keep existing)"
        required: false
        default: ""

      authors:
        description: "Override authors (comma separated)"
        required: false
        default: ""

      clamp_minimum_ap_version:
        description: "Clamp minimum_ap_version to latest stable Archipelago release"
        type: boolean
        default: true

      include_changelog:
        description: "Include changelog in release notes"
        type: boolean
        default: true

      release_notes_file:
        description: "Release notes template (blank = built-in)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: apworld-release-${{ github.event.inputs.world }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PYTHON_VERSION: "3.12"

    steps:

      ####################################################################
      # Checkout
      ####################################################################

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      ####################################################################
      # Python
      ####################################################################

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Archipelago requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools>=75,<81"

          python -c "import pkg_resources; print('pkg_resources OK')"

          python ModuleUpdate.py --yes

      ####################################################################
      # Read / Create manifest
      ####################################################################

      - name: Read or create APWorld manifest
        id: world_info
        env:
          WORLD: ${{ github.event.inputs.world }}
          GAME_OVERRIDE: ${{ github.event.inputs.game }}
        run: |
          python <<'PY'
          import json
          import os
          from pathlib import Path

          world = os.environ["WORLD"]
          game_override = os.environ["GAME_OVERRIDE"]

          manifest_path = Path(f"worlds/{world}/archipelago.json")

          if manifest_path.exists():
              print(f"Found manifest: {manifest_path}")

              with open(manifest_path) as f:
                  manifest = json.load(f)

              if "game" not in manifest:
                  raise SystemExit(
                      f"{manifest_path} exists but has no 'game' field"
                  )

              game = manifest["game"]

          else:
              print("No archipelago.json found")

              if not game_override:
                  raise SystemExit(
                      "No archipelago.json found and no game override supplied. "
                      "Please provide the game input."
                  )

              print(f"Creating manifest using override: {game_override}")

              game = game_override

              manifest = {
                  "game": game,
                  "world_version": "0.0.0"
              }

              manifest_path.write_text(
                  json.dumps(manifest, indent=4) + "\n"
              )

              print(f"Created {manifest_path}")

          print(f"Using APWorld game name: {game}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print(f"game={game}", file=f)

          PY

      ####################################################################
      # Latest Stable Archipelago Release
      ####################################################################

      - name: Get latest stable Archipelago version
        id: stable_ap
        run: |

          python <<'PY'
          import json
          import urllib.request
          import os

          url = "https://api.github.com/repos/ArchipelagoMW/Archipelago/releases"

          with urllib.request.urlopen(url) as r:
              releases = json.load(r)

          stable = next(
              r for r in releases
              if not r["prerelease"]
          )

          version = stable["tag_name"].removeprefix("v")

          print(f"Latest stable Archipelago: {version}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print(f"version={version}", file=f)
          PY

      ####################################################################
      # Update manifest
      ####################################################################

      - name: Update manifest
        id: manifest
        env:
          WORLD: ${{ github.event.inputs.world }}
          BUMP: ${{ github.event.inputs.bump }}
          OVERRIDE_VERSION: ${{ github.event.inputs.world_version }}
          GAME: ${{ github.event.inputs.game }}
          MINIMUM: ${{ github.event.inputs.minimum_ap_version }}
          MAXIMUM: ${{ github.event.inputs.maximum_ap_version }}
          AUTHORS: ${{ github.event.inputs.authors }}
          CLAMP: ${{ github.event.inputs.clamp_minimum_ap_version }}
          STABLE_AP: ${{ steps.stable_ap.outputs.version }}
        run: |

          python <<'PY'
          import json
          import os
          from pathlib import Path

          def parse(v):
              return tuple(map(int, v.split(".")))

          world = os.environ["WORLD"]

          manifest_path = Path(f"worlds/{world}/archipelago.json")

          if not manifest_path.exists():
              raise SystemExit(f"{manifest_path} not found")

          manifest = json.loads(manifest_path.read_text())

          original = manifest.copy()

          #
          # world_version
          #

          if os.environ["OVERRIDE_VERSION"]:
              manifest["world_version"] = os.environ["OVERRIDE_VERSION"]

          elif os.environ["BUMP"] != "none":

              major, minor, patch = map(
                  int,
                  manifest["world_version"].split(".")
              )

              bump = os.environ["BUMP"]

              if bump == "major":
                  major += 1
                  minor = 0
                  patch = 0

              elif bump == "minor":
                  minor += 1
                  patch = 0

              elif bump == "patch":
                  patch += 1

              manifest["world_version"] = f"{major}.{minor}.{patch}"

          #
          # overrides
          #

          if os.environ["GAME"]:
              manifest["game"] = os.environ["GAME"]

          if os.environ["MINIMUM"]:
              manifest["minimum_ap_version"] = os.environ["MINIMUM"]

          if os.environ["MAXIMUM"]:
              manifest["maximum_ap_version"] = os.environ["MAXIMUM"]

          if os.environ["AUTHORS"]:
              manifest["authors"] = [
                  a.strip()
                  for a in os.environ["AUTHORS"].split(",")
                  if a.strip()
              ]

          #
          # clamp minimum AP version
          #

          if (
              os.environ["CLAMP"] == "true"
              and "minimum_ap_version" in manifest
          ):
              stable = os.environ["STABLE_AP"]

              if parse(manifest["minimum_ap_version"]) > parse(stable):
                  manifest["minimum_ap_version"] = stable

          #
          # save
          #

          manifest_path.write_text(
              json.dumps(manifest, indent=4) + "\n"
          )

          #
          # summary
          #

          print("")
          print("Manifest changes")
          print("=" * 60)

          for key in (
              "game",
              "world_version",
              "minimum_ap_version",
              "maximum_ap_version",
              "authors",
          ):
              old = original.get(key, "<unset>")
              new = manifest.get(key, "<unset>")

              if old != new:
                  print(f"{key}:")
                  print(f"  {old}")
                  print(f"  -> {new}")
              else:
                  print(f"{key}: unchanged")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print(
                  f"world_version={manifest['world_version']}",
                  file=f
              )
              print(
                  f"game={manifest['game']}",
                  file=f
              )

          PY

      ####################################################################
      # Commit manifest update
      ####################################################################

      - name: Commit manifest
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add \
            worlds/${{ github.event.inputs.world }}/archipelago.json

          git diff --cached --quiet && exit 0

          git commit \
            -m "Release ${{ github.event.inputs.world }} v${{ steps.manifest.outputs.world_version }}"

      ####################################################################
      # Build APWorld
      ####################################################################

      - name: Build APWorld
        run: |
          python Launcher.py \
            "Build APWorlds" \
            -- \
            "${{ steps.world_info.outputs.game }}"

      ####################################################################
      # Verify output
      ####################################################################

      - name: Verify APWorld exists
        run: |

          APWORLD="build/apworlds/${{ github.event.inputs.world }}.apworld"

          if [ ! -f "$APWORLD" ]; then
            echo "::error::Expected $APWORLD"
            exit 1
          fi

          ls -lh "$APWORLD"

      ####################################################################
      # Find previous release for this world
      ####################################################################

      - name: Find previous release
        id: previous_release
        env:
          GH_TOKEN: ${{ github.token }}
          WORLD: ${{ github.event.inputs.world }}
        run: |

          TAG=$(gh release list \
            --limit 200 \
            --json tagName,isDraft,isPrerelease \
            --jq "
              .[]
              | select(.isDraft == false)
              | select(.isPrerelease == false)
              | select(.tagName | startswith(\"${WORLD}-v\"))
              | .tagName
            " \
            | head -n1)

          echo "Previous release: ${TAG:-none}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"


      ####################################################################
      # Generate release notes
      ####################################################################

      - name: Generate release notes
        env:
          WORLD: ${{ github.event.inputs.world }}
          VERSION: ${{ steps.manifest.outputs.world_version }}
          INCLUDE_CHANGELOG: ${{ github.event.inputs.include_changelog }}
          NOTES_FILE: ${{ github.event.inputs.release_notes_file }}
          PREVIOUS_TAG: ${{ steps.previous_release.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |

          python <<'PY'
          import os
          import subprocess
          from pathlib import Path

          world = os.environ["WORLD"]
          version = os.environ["VERSION"]
          previous = os.environ["PREVIOUS_TAG"]
          repo = os.environ["REPOSITORY"]
          branch = os.environ["BRANCH"]

          notes_file = os.environ["NOTES_FILE"]

          #
          # Load custom template if available
          #

          template = None

          if notes_file:
              path = Path(notes_file)

              if path.exists():
                  template = path.read_text()

          if template:
              notes = template.replace(
                  "{VERSION}",
                  version
              )

          else:
              notes = f"""## Installation & Setup

          - Requires [Archipelago Launcher](https://github.com/ArchipelagoMW/Archipelago/releases/latest). (Make sure you're up-to-date).
          - Download the `.apworld` file below and double-click it to install. After the installation confirmation appears, restart Archipelago.
          - Use **Options Creator** or **Generate Template Options** in the Archipelago Launcher to generate player option YAML files.
          - Place your edited player option YAMLs in the `Players` folder. (Use **Browse Files...** in the Launcher to open your Archipelago directory.)
          - Make sure you have all required `.apworld` files, your player YAMLs, and any desired `host.yaml` settings ready before generating. (`server_password` is recommended for admin login.)
          - Click **Generate** to create a multiworld `.zip` in the `output` folder. (The terminal closes automatically if generation succeeds.)
          - Upload the generated `.zip` to https://archipelago.gg/uploads or self-host. (Self-hosting requires port forwarding.)
          - For detailed setup instructions and game-specific randomizer documentation, see: https://github.com/{repo}/tree/{branch}/worlds/{world}/docs
          - If you encounter errors, run `ArchipelagoLauncherDebug.exe` (or launch Archipelago from a terminal) and check the `logs` folder.
          - Need help? Join the Archipelago Discord: https://discord.gg/8Z65BR2

          """

          #
          # Add changelog
          #

          if os.environ["INCLUDE_CHANGELOG"] == "true":

              notes += "\n\n## Changelog\n\n"

              if previous:

                  command = [
                      "git",
                      "log",
                      f"{previous}..HEAD",
                      "--no-merges",
                      "--pretty=- %s (%h)",
                      "--",
                      f"worlds/{world}/"
                  ]

              else:

                  command = [
                      "git",
                      "log",
                      "--no-merges",
                      "--pretty=- %s (%h)",
                      "--",
                      f"worlds/{world}/"
                  ]

              result = subprocess.run(
                  command,
                  capture_output=True,
                  text=True
              )

              changelog = result.stdout.strip()

              if changelog:
                  notes += changelog
              else:
                  notes += "- No changes since previous release."

              if previous:
                  current = f"{world}-v{version}"

                  notes += (
                      "\n\n"
                      f"Full comparison:\n"
                      f"https://github.com/{repo}/compare/{previous}...{current}"
                  )

          Path("release_notes.md").write_text(notes)

          PY


      ####################################################################
      # Push
      ####################################################################

      - name: Push release commit
        run: |
          git push origin HEAD


      ####################################################################
      # Create tag
      ####################################################################

      - name: Create release tag
        id: tag
        env:
          WORLD: ${{ github.event.inputs.world }}
          VERSION: ${{ steps.manifest.outputs.world_version }}
        run: |

          TAG="${WORLD}-v${VERSION}"

          echo "Creating tag: $TAG"

          git tag "$TAG"

          git push origin "$TAG"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"


      ####################################################################
      # Create GitHub Release
      ####################################################################

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "${{ steps.world_info.outputs.game }} APWorld release v${{ steps.manifest.outputs.world_version }}"
          body_path: release_notes.md
          files: |
            build/apworlds/${{ github.event.inputs.world }}.apworld


      ####################################################################
      # Cleanup on failure
      ####################################################################

      - name: Cleanup on failure
        if: failure()
        run: |
          echo "Cleaning failed workflow changes"

          git reset --hard HEAD
          git clean -fd
